<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SIGNAL // 终局解密</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--c-bg:#05050b;--c-fg:#eef1fa;--c-dim:rgba(238,241,250,.6);--c-mute:rgba(238,241,250,.28);--c-line:rgba(255,255,255,.08);--c-cyan:#22d3ee;--c-green:#34d399;--c-red:#ff4d63;--c-card:rgba(255,255,255,.02)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--c-bg);color:var(--c-fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}
a{color:var(--c-cyan);text-decoration:none}
.wrap{max-width:640px;margin:0 auto;padding:56px 22px 48px}
.head{text-align:center}
.kicker{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.3em;color:var(--c-red)}
h1{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:24px;letter-spacing:.16em;margin-top:14px}
.sub{margin-top:12px;font-size:13px;letter-spacing:.08em;color:var(--c-dim);line-height:1.8}
.led{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:6px 14px;border:1px solid var(--c-line);border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--c-dim)}
.led i{width:7px;height:7px;border-radius:50%;background:var(--c-green);box-shadow:0 0 12px var(--c-green);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.card{border:1px solid var(--c-line);border-radius:12px;padding:28px 24px;background:var(--c-card);margin-top:34px}
.brief-title{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.24em;color:var(--c-dim);text-align:center}
.frag{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border:1px solid var(--c-line);border-radius:10px;background:var(--c-card);transition:border-color .35s ease}
.frag.done{border-color:rgba(52,211,153,.38)}
.frag-idx{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--c-mute);letter-spacing:.1em;flex-shrink:0}
.frag-body{flex:1;min-width:0}
.frag-name{font-family:'JetBrains Mono',monospace;font-size:13px}
.frag-desc{font-size:11px;line-height:1.55;color:var(--c-mute);margin-top:2px}
.frag-input{width:84px;padding:8px 9px;background:var(--c-card);border:1px solid var(--c-line);border-radius:6px;color:var(--c-fg);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-align:center;outline:none}
.frag-input:focus{border-color:var(--c-cyan)}
.frag-input:disabled{opacity:.45;cursor:default;border-color:rgba(52,211,153,.25);color:var(--c-green)}
.frag-state{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;color:var(--c-mute);flex-shrink:0;min-width:60px;text-align:right}
.frag.done .frag-state{color:var(--c-green)}
.hint{margin-top:14px;min-height:16px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--c-green);text-align:center}
.form{margin-top:26px;border-top:1px dashed var(--c-line);padding-top:24px;text-align:center}
.form-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--c-mute)}
.form input{width:100%;margin-top:14px;padding:14px 16px;background:var(--c-card);border:1px solid var(--c-line);border-radius:8px;color:var(--c-fg);font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.12em;text-align:center;outline:none}
.form input::placeholder{color:var(--c-mute)}
.form input:focus{border-color:var(--c-cyan)}
.err{margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:#ff6b7a;min-height:14px}
.btn{margin-top:16px;padding:12px 34px;border:1px solid var(--c-cyan);border-radius:999px;color:var(--c-cyan);background:transparent;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.24em;cursor:pointer;transition:all .3s ease}
.btn:hover{background:var(--c-cyan);color:#04121a}
.reveal{margin-top:30px;opacity:0;visibility:hidden;transition:opacity 1.4s ease}
.reveal.show{opacity:1;visibility:visible}
.reveal-title{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;letter-spacing:.16em;color:var(--c-fg);text-align:center}
.reveal-sub{margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;color:var(--c-mute);text-align:center}
.reveal-frame{margin-top:20px;border:1px dashed var(--c-line);border-radius:10px;height:180px;overflow:hidden;position:relative;background:radial-gradient(ellipse at center,rgba(34,211,238,.06),transparent 70%)}
.reveal-frame canvas{position:absolute;inset:0;width:100%;height:100%}
.reveal-note{margin-top:18px;font-size:12px;line-height:2;color:var(--c-dim);text-align:center}
.divider{height:1px;background:var(--c-line);margin:26px 0}
.back{font-size:12px;color:var(--c-mute);text-align:center}
.back a{border-bottom:1px solid rgba(34,211,238,.4)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="kicker">ARG // FINAL NODE</div>
    <h1>SIGNAL // 终局</h1>
    <p class="sub">三串频率已在你手中。<br>把它们拼成一把钥匙，敲开最后那扇门。</p>
    <div class="led"><i></i>CHANNEL — AWAITING KEY</div>
  </div>

  <div class="card">
    <div class="brief-title" id="brief-title">SIGNAL FRAGMENTS · 信号碎片</div>

    <div class="frag" id="frag-signal">
      <span class="frag-idx">01</span>
      <div class="frag-body"><div class="frag-name">频率</div><div class="frag-desc">从一片噪声里分离出的红</div></div>
      <input class="frag-input" id="in-signal" maxlength="8" placeholder="频率" autocomplete="off" spellcheck="false">
      <span class="frag-state" id="st-signal">○ 未捕获</span>
    </div>

    <div class="frag" id="frag-radio">
      <span class="frag-idx">02</span>
      <div class="frag-body"><div class="frag-name">电台回执码</div><div class="frag-desc">向电台发信后，等到的回音</div></div>
      <input class="frag-input" id="in-radio" maxlength="8" placeholder="回执码" autocomplete="off" spellcheck="false">
      <span class="frag-state" id="st-radio">○ 未捕获</span>
    </div>

    <div class="frag" id="frag-stegan">
      <span class="frag-idx">03</span>
      <div class="frag-body"><div class="frag-name">隐写坐标码</div><div class="frag-desc">从像素最末一位里拆出的秘密</div></div>
      <input class="frag-input" id="in-stegan" maxlength="8" placeholder="坐标码" autocomplete="off" spellcheck="false">
      <span class="frag-state" id="st-stegan">○ 未捕获</span>
    </div>

    <div class="hint" id="hint"></div>
  </div>

  <div class="card">
    <div class="form" id="form">
      <div class="form-label">FINAL KEY · 输入全长密钥</div>
      <input id="final-input" type="text" autocomplete="off" spellcheck="false" placeholder="把三串频率按顺序拼起来">
      <div class="err" id="err"></div>
      <button class="btn" id="submit" type="button">[ 校验信号 ]</button>
    </div>

    <div class="reveal" id="reveal">
      <div class="reveal-title">第五首歌 · 已接收</div>
      <div class="reveal-sub">TRANSMISSION COMPLETE // 2026</div>
      <div class="reveal-frame"><canvas id="wave"></canvas></div>
      <p class="reveal-note" id="reveal-note">封印已解开。<br>返回官网，第五首歌会在作品区等你。</p>
    </div>
  </div>

  <div class="divider"></div>
  <p class="back">返回 <a href="index.html">官网</a></p>
</div>

<script>
(function(){
  'use strict';
  var P = {
    signalHash:  atob('YmU0YjJmNDUwNjljMTgwZWYzMDk1MjFmNjc3MDE0NjkyMGRmMThlNjkxNjVjNTc3ZGM3ZmY4ZTVhN2MzNDQ2NQ=='),
    radioHash:   atob('MDdkZjQ3ZjQ4NTcyMjk4MDUzMzNhM2RlMTQxYjYzMThiNjk5ZTRhZTUyYTg2MGM5OTIzZGI2ZGU5YThiZjE2Yw=='),
    steganHash:  atob('MjUxZDI5ODExNmUzMWZkZGNhMTU4YzQwMGZjMDcwZTJlNmMzMzMzZWEwZmNkMTNjNzc4ZjQ1MzkwZTk2ZjZmOQ=='),
    finalHash:   atob('MjllZmUxNTdiZjJiMzdiMDM2NzczZDJhNmQwZDBmMTMzNjE2ZmI3ODM4ZGQxZjdkZTY2NjE5MGNkNmQ3N2NmNw=='),
    unlockKey:   'make-studio-arg-final',
    progKey:     'make-studio-arg'
  };

  var prog = { signal:false, radio:false, stegan:false };
  try{ var saved = JSON.parse(localStorage.getItem(P.progKey) || '{}'); if(saved.signal)prog.signal=true; if(saved.radio)prog.radio=true; if(saved.stegan)prog.stegan=true; }catch(e){}

  var answered = false;
  try{ answered = localStorage.getItem(P.unlockKey) === '1'; }catch(e){}

  function sha256(text){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
    });
  }
  function norm(s){ return String(s).trim().replace(/\s+/g,''); }

  function setFrag(node, stateEl, on){
    if(on){ node.classList.add('done'); stateEl.textContent = '● 已捕获'; } else { node.classList.remove('done'); stateEl.textContent = '○ 未捕获'; }
  }
  function saveProg(){ try{ localStorage.setItem(P.progKey, JSON.stringify(prog)); }catch(e){} }
  function render(){
    var c = (prog.signal?1:0)+(prog.radio?1:0)+(prog.stegan?1:0);
    setFrag(document.getElementById('frag-signal'), document.getElementById('st-signal'), prog.signal);
    setFrag(document.getElementById('frag-radio'),  document.getElementById('st-radio'),  prog.radio);
    setFrag(document.getElementById('frag-stegan'), document.getElementById('st-stegan'), prog.stegan);
    document.getElementById('brief-title').textContent = 'SIGNAL FRAGMENTS · 信号碎片  ' + c + '/3';
    var h = document.getElementById('hint');
    if(c === 3) h.textContent = '■ 三线闭合 · 密钥 = 频率 · 回执码 · 坐标码';
    else h.textContent = '已捕获 ' + c + '/3 · 把其余碎片带回这里';
    document.getElementById('in-radio').disabled = prog.radio;
    document.getElementById('in-stegan').disabled = prog.stegan;
    document.getElementById('in-signal').disabled = prog.signal;
    if(answered) renderUnlocked();
  }

  function checkFrag(which){
    var inp = document.getElementById('in-' + which);
    var target = P[which === 'signal' ? 'signalHash' : (which === 'radio' ? 'radioHash' : 'steganHash')];
    var val = norm(inp.value);
    if(!val) return;
    sha256(val).then(function(h){
      if(h === target){ prog[which] = true; saveProg(); inp.value=''; render(); }
      else { inp.value=''; inp.placeholder='× 无效'; inp.focus(); }
    });
  }
  ['signal','radio','stegan'].forEach(function(w){
    var inp = document.getElementById('in-' + w);
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); checkFrag(w); } });
  });

  function submitFinal(){
    if(answered) return;
    var val = norm(document.getElementById('final-input').value);
    var err = document.getElementById('err');
    if(!val){ err.textContent = ''; return; }
    sha256(val).then(function(h){
      if(h === P.finalHash){
        answered = true;
        try{ localStorage.setItem(P.unlockKey, '1'); }catch(e){}
        err.textContent = '';
        document.getElementById('final-input').value = '';
        renderUnlocked();
      } else {
        err.textContent = '校验失败，信号仍锁着。';
        document.getElementById('final-input').focus();
      }
    });
  }
  document.getElementById('submit').addEventListener('click', submitFinal);
  document.getElementById('final-input').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); submitFinal(); } });

  function renderUnlocked(){
    var rev = document.getElementById('reveal');
    var form = document.getElementById('form');
    form.style.display = 'none';
    rev.classList.add('show');
    drawWave();
  }

  /* ---- 波形曲线：渐显 + 从左到右绘制 ---- */
  function drawWave(){
    var cv = document.getElementById('wave');
    if(!cv) return;
    var dpr = window.devicePixelRatio || 1;
    var rect = cv.parentElement.getBoundingClientRect();
    cv.width = rect.width * dpr;
    cv.height = rect.height * dpr;
    var ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    var W = rect.width, H = rect.height;
    var t0 = null, DUR = 1800;
    function frame(t){
      if(!t0) t0 = t;
      var p = Math.min(1, (t - t0) / DUR);
      ctx.clearRect(0, 0, W, H);
      var cx = W/2, cy = H/2, amp = H*0.34;
      // 主波形（正弦，随 p 从左往右展开）
      ctx.beginPath();
      ctx.strokeStyle = '#22d3ee';
      ctx.lineWidth = 2;
      ctx.globalAlpha = p;
      var span = 6; // 周期数
      for(var x = 0; x <= W * p; x++){
        var t2 = (x / W) * span * Math.PI * 2;
        var y = cy + Math.sin(t2) * amp * (0.4 + 0.6 * Math.sin(x/W*Math.PI));
        if(x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      if(p < 1) requestAnimationFrame(frame);
      else { /* 完成后再描一条更亮的中心线 */ }
    }
    requestAnimationFrame(frame);
  }

  render();
})();
</script>
<script>
/* 软防护：拦右键 / F12 / 查看源码快捷键 */
(function(){
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase(), c = e.ctrlKey || e.metaKey;
    if(e.key === 'F12' || (c && e.shiftKey && (k==='i'||k==='j'||k==='c')) || (c && k==='u')){ e.preventDefault(); e.stopPropagation(); return false; }
  }, true);
})();
</script>
</body>
</html>
