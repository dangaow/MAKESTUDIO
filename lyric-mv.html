<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyric MV</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: #000;
  font-family: 'Impact', 'Arial Black', sans-serif;
}

#container {
  width: 100%;
  height: 100%;
  position: relative;
}

/* Noise overlay */
#container::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" /></filter><rect width="200" height="200" filter="url(%23noise)" opacity="0.4" /></svg>');
  opacity: 0.25;
  z-index: 50;
  pointer-events: none;
  animation: noiseMove 0.2s infinite steps(8);
  mix-blend-mode: overlay;
}

@keyframes noiseMove {
  0% { transform: translate(0, 0); }
  25% { transform: translate(-5%, -5%); }
  50% { transform: translate(5%, -5%); }
  75% { transform: translate(-5%, 5%); }
  100% { transform: translate(5%, 5%); }
}

/* Scanlines */
#container::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.15),
    rgba(0, 0, 0, 0.15) 1px,
    transparent 1px,
    transparent 2px
  );
  z-index: 60;
  pointer-events: none;
  animation: scanline 8s linear infinite;
}

@keyframes scanline {
  0% { transform: translateY(0); }
  100% { transform: translateY(100%); }
}

/* Glitch bars that appear randomly */
.glitch-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 70;
  pointer-events: none;
}

.glitch-bar {
  position: absolute;
  left: 0;
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff);
  mix-blend-mode: screen;
  opacity: 0;
  animation: glitchBar 2s infinite;
}

.glitch-bar:nth-child(1) { animation-delay: 0s; }
.glitch-bar:nth-child(2) { animation-delay: 0.7s; }
.glitch-bar:nth-child(3) { animation-delay: 1.4s; }

@keyframes glitchBar {
  0% { top: 10%; opacity: 0; }
  1% { opacity: 1; }
  2% { top: 30%; }
  3% { opacity: 0; }
  4% { top: 70%; opacity: 1; }
  5% { opacity: 0; }
  100% { top: 90%; opacity: 0; }
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#lyric {
  position: absolute;
  bottom: 30%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 80px;
  font-weight: 900;
  color: #ffffff;
  text-align: center;
  text-transform: none;
  letter-spacing: 3px;
  line-height: 1.4;
  max-width: 85%;
  z-index: 100;
  text-shadow:
    4px 0 0 rgba(255, 0, 255, 0.8),
    -4px 0 0 rgba(0, 255, 255, 0.8),
    0 0 40px rgba(255, 255, 255, 0.5);
  mix-blend-mode: screen;
  filter: contrast(1.2) brightness(1.1);
}

.glitch {
  animation: glitch 0.3s infinite, rgbShift 0.15s infinite;
}

@keyframes glitch {
  0% {
    transform: translateX(-50%) translate(0);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  }
  10% {
    transform: translateX(-50%) translate(-8px, 3px);
    clip-path: polygon(0 10%, 100% 0%, 100% 90%, 0 100%);
  }
  20% {
    transform: translateX(-50%) translate(8px, -3px);
    clip-path: polygon(0 0%, 100% 10%, 100% 100%, 0 90%);
  }
  30% {
    transform: translateX(-50%) translate(-5px, -8px);
    clip-path: polygon(0 20%, 100% 5%, 100% 85%, 0 95%);
  }
  40% {
    transform: translateX(-50%) translate(5px, 8px);
    clip-path: polygon(0 5%, 100% 20%, 100% 95%, 0 80%);
  }
  50% {
    transform: translateX(-50%) translate(-10px, 2px);
    text-shadow:
      10px 0 0 rgba(255, 0, 255, 1),
      -10px 0 0 rgba(0, 255, 255, 1);
  }
  60% {
    transform: translateX(-50%) translate(3px, -5px);
  }
  70% {
    transform: translateX(-50%) translate(-3px, 5px);
  }
  80% {
    transform: translateX(-50%) translate(10px, -2px);
  }
  90% {
    transform: translateX(-50%) translate(-2px, 10px);
  }
  100% {
    transform: translateX(-50%) translate(0);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  }
}

@keyframes rgbShift {
  0% {
    text-shadow:
      5px 0 0 rgba(255, 0, 255, 0.9),
      -5px 0 0 rgba(0, 255, 255, 0.9),
      0 0 40px rgba(255, 255, 255, 0.6);
  }
  25% {
    text-shadow:
      -7px 0 0 rgba(255, 0, 0, 0.9),
      7px 0 0 rgba(0, 255, 0, 0.9),
      0 0 40px rgba(255, 255, 255, 0.6);
  }
  50% {
    text-shadow:
      6px 0 0 rgba(255, 255, 0, 0.9),
      -6px 0 0 rgba(255, 0, 255, 0.9),
      0 0 40px rgba(255, 255, 255, 0.6);
  }
  75% {
    text-shadow:
      -8px 0 0 rgba(0, 255, 255, 0.9),
      8px 0 0 rgba(255, 0, 255, 0.9),
      0 0 40px rgba(255, 255, 255, 0.6);
  }
  100% {
    text-shadow:
      5px 0 0 rgba(255, 0, 255, 0.9),
      -5px 0 0 rgba(0, 255, 255, 0.9),
      0 0 40px rgba(255, 255, 255, 0.6);
  }
}

.flash {
  animation: flash 0.1s ease-out;
}

@keyframes flash {
  0% { opacity: 1; filter: brightness(3); }
  100% { opacity: 1; filter: brightness(1); }
}

</style>
</head>
<body>
<div id="container">
  <canvas id="canvas"></canvas>
  <div class="glitch-overlay">
    <div class="glitch-bar"></div>
    <div class="glitch-bar"></div>
    <div class="glitch-bar"></div>
  </div>
  <div id="lyric"></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js';

const LYRICS = [
  {"time": 21.928, "text": "我试着不去猜"},
  {"time": 23.12, "text": "我试着不去期待"},
  {"time": 24.409, "text": "好像又遭遇些"},
  {"time": 25.56, "text": "你故意清除的空白"},
  {"time": 27.002, "text": "我没有质疑你"},
  {"time": 28.401, "text": "只是问题在这"},
  {"time": 29.695, "text": "可是你把它当作"},
  {"time": 30.799, "text": "我和你最后决赛"},
  {"time": 32.541, "text": "别让我在你面前"},
  {"time": 33.771, "text": "就失态"},
  {"time": 34.987, "text": "别对我敲连击"},
  {"time": 36.065, "text": "把我击倒"},
  {"time": 37.375, "text": "不要这样就"},
  {"time": 38.641, "text": "不要躲着我"},
  {"time": 39.888, "text": "就别抱紧我"},
  {"time": 41.126, "text": "woah"},
  {"time": 42.421, "text": "你总说你没有做"},
  {"time": 43.356, "text": "你总说你拯救我"},
  {"time": 44.91, "text": "全都是bullshxt"},
  {"time": 45.959, "text": "你从来没救赎过"},
  {"time": 47.422, "text": "逃避的人是我"},
  {"time": 48.523, "text": "不说话的也是我"},
  {"time": 49.784, "text": "好像什么都是我"},
  {"time": 51.077, "text": "好像什么都该我"},
  {"time": 52.901, "text": "别让我在你面前"},
  {"time": 54.223, "text": "就失态"},
  {"time": 55.421, "text": "别对我敲连击"},
  {"time": 56.408, "text": "把我击倒"},
  {"time": 57.753, "text": "不要这样就"},
  {"time": 59.071, "text": "不要躲着我"},
  {"time": 60.346, "text": "就别抱紧我"},
  {"time": 61.611, "text": "woah"},
  {"time": 63.481, "text": "好像我们曾经相识"},
  {"time": 65.357, "text": "好像很久很久我们就已相识"},
  {"time": 67.937, "text": "可我们还要伤害彼此像是将士"},
  {"time": 70.353, "text": "你自己也不知道自己会变这样子"},
  {"time": 73.256, "text": "我的心像大雨落下"},
  {"time": 75.875, "text": "你对我说的话有真有假"},
  {"time": 78.781, "text": "就别再想着跟我说谎话"}
];

let scene, camera, renderer;
let time = 0;
let currentLyricIndex = 0;
let meshes = [];

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  camera = new THREE.PerspectiveCamera(75, 1920 / 1080, 0.1, 1000);
  camera.position.z = 20;

  renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('canvas'),
    antialias: false,
    alpha: false
  });
  renderer.setSize(1920, 1080);

  createScene();
}

function createScene() {
  // Low-poly geometric shapes with vivid colors
  const colors = [0x00ffff, 0xff00ff, 0x00ff00, 0xffff00, 0xff0099, 0x00ff99];

  // Central rotating cube
  const geo1 = new THREE.BoxGeometry(6, 6, 6);
  const mat1 = new THREE.MeshBasicMaterial({
    color: 0x00ffff,
    wireframe: true,
    transparent: true,
    opacity: 0.8
  });
  const cube = new THREE.Mesh(geo1, mat1);
  scene.add(cube);
  meshes.push({ mesh: cube, speed: { x: 0.015, y: 0.02, z: 0.01 } });

  // Octahedrons floating around
  for (let i = 0; i < 5; i++) {
    const geo = new THREE.OctahedronGeometry(2 + Math.random() * 2);
    const mat = new THREE.MeshBasicMaterial({
      color: colors[i % colors.length],
      wireframe: true,
      transparent: true,
      opacity: 0.6 + Math.random() * 0.4
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(
      (Math.random() - 0.5) * 30,
      (Math.random() - 0.5) * 20,
      (Math.random() - 0.5) * 20 - 10
    );
    scene.add(mesh);
    meshes.push({
      mesh,
      speed: { x: 0.01 + Math.random() * 0.02, y: 0.01 + Math.random() * 0.02, z: 0.005 },
      orbit: { radius: 10 + Math.random() * 10, angle: Math.random() * Math.PI * 2 }
    });
  }

  // Tunnel rings
  for (let i = 0; i < 40; i++) {
    const ringGeo = new THREE.TorusGeometry(10 + i * 0.3, 0.15, 6, 24);
    const hue = (i / 40 + time * 0.1) % 1;
    const ringMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color().setHSL(hue, 1, 0.5),
      transparent: true,
      opacity: 0.4 + Math.random() * 0.3
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.z = -i * 4 - 20;
    scene.add(ring);
    meshes.push({
      mesh: ring,
      type: 'tunnel',
      index: i,
      speed: { z: 0.3 }
    });
  }

  // Add some tetrahedrons
  for (let i = 0; i < 8; i++) {
    const geo = new THREE.TetrahedronGeometry(1.5);
    const mat = new THREE.MeshBasicMaterial({
      color: colors[Math.floor(Math.random() * colors.length)],
      wireframe: false,
      transparent: true,
      opacity: 0.7
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(
      (Math.random() - 0.5) * 40,
      (Math.random() - 0.5) * 30,
      (Math.random() - 0.5) * 30
    );
    scene.add(mesh);
    meshes.push({
      mesh,
      speed: { x: 0.02, y: 0.03, z: 0.01 }
    });
  }
}

function updateLyrics(currentTime) {
  const lyricEl = document.getElementById('lyric');

  for (let i = 0; i < LYRICS.length; i++) {
    if (currentTime >= LYRICS[i].time && (i === LYRICS.length - 1 || currentTime < LYRICS[i + 1].time)) {
      if (currentLyricIndex !== i) {
        currentLyricIndex = i;
        lyricEl.textContent = LYRICS[i].text;
        lyricEl.classList.remove('glitch', 'flash');
        void lyricEl.offsetWidth;
        lyricEl.classList.add('glitch', 'flash');
      }
      break;
    }
  }
}

function animate() {
  requestAnimationFrame(animate);

  time += 0.0167; // ~60fps worth of time increment
  window.time = time; // Expose for puppeteer
  updateLyrics(time);

  // Animate all meshes
  meshes.forEach(item => {
    const { mesh, speed, type, orbit, index } = item;

    if (type === 'tunnel') {
      // Tunnel movement
      mesh.position.z += speed.z;
      if (mesh.position.z > 20) {
        mesh.position.z = -160;
      }
      mesh.rotation.z += 0.005;

      // Color shift
      const hue = (index / 40 + time * 0.1) % 1;
      mesh.material.color.setHSL(hue, 1, 0.5);
    } else if (orbit) {
      // Orbiting objects
      orbit.angle += 0.01;
      mesh.position.x = Math.cos(orbit.angle) * orbit.radius;
      mesh.position.y = Math.sin(orbit.angle) * orbit.radius * 0.5;
      mesh.rotation.x += speed.x;
      mesh.rotation.y += speed.y;
    } else {
      // Rotating objects
      mesh.rotation.x += speed.x;
      mesh.rotation.y += speed.y;
      if (speed.z) mesh.rotation.z += speed.z;
    }
  });

  // Dynamic camera movement
  camera.position.x = Math.sin(time * 0.2) * 8;
  camera.position.y = Math.cos(time * 0.15) * 5;
  camera.lookAt(0, 0, 0);

  // Add glitch effect randomly
  if (Math.random() > 0.95) {
    renderer.domElement.style.filter = `hue-rotate(${Math.random() * 360}deg)`;
    setTimeout(() => {
      renderer.domElement.style.filter = '';
    }, 50);
  }

  renderer.render(scene, camera);
}

init();
animate();
</script>
</body>
</html>
