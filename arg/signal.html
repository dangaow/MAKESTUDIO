<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SIGNAL // 节点未开放</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --c-bg:#05050b;--c-fg:#eef1fa;
  --c-fg-dim:rgba(238,241,250,.6);--c-fg-mute:rgba(238,241,250,.28);
  --c-line:rgba(255,255,255,.08);
  --c-cyan:#22d3ee;--c-red:#ff4d63;
  --c-card:rgba(255,255,255,.02);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--c-bg);color:var(--c-fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:64px 24px 48px}
.head{text-align:center}
.kicker{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.3em;color:var(--c-red)}
h1{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:26px;letter-spacing:.18em;margin-top:14px}
.sub{margin-top:12px;font-size:13px;letter-spacing:.08em;color:var(--c-fg-dim);line-height:1.8}
.led{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:6px 14px;border:1px solid var(--c-line);border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--c-fg-dim)}
.led i{width:7px;height:7px;border-radius:50%;background:var(--c-red);box-shadow:0 0 12px var(--c-red);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.stage{margin-top:40px}
.card{border:1px solid var(--c-line);border-radius:10px;padding:34px 26px;background:var(--c-card);text-align:center}
.card .glyph{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;letter-spacing:.24em;color:var(--c-fg-mute)}
.card .msg{margin-top:18px;font-size:14px;line-height:2;color:var(--c-fg-dim)}
.divider{height:1px;background:var(--c-line);margin:24px 0}
.note{font-size:12px;line-height:1.9;color:var(--c-fg-mute);text-align:center}
.note a{color:var(--c-cyan);text-decoration:none;border-bottom:1px solid rgba(34,211,238,.4)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="kicker">ARG // NODE 00</div>
    <h1>SIGNAL OFFLINE</h1>
    <p class="sub">这条信道尚未开启，请等待更新。</p>
    <div class="led"><i></i>CHANNEL — NO CARRIER</div>
  </div>

  <div class="stage">
    <div class="card">
      <div class="glyph">■ LOCKED</div>
      <p class="msg">
        信号通道暂时关闭。<br>
        等到指定时间，这里会重新亮起来。
      </p>
    </div>
  </div>

  <div class="divider"></div>
  <p class="note">返回 <a href="../index.html">官网</a></p>
</div>
</body>
</html>
