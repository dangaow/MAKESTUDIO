<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DREAMSIDE // 昏暗的房间</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Song+Myung&family=Nunito:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden}
body{font-family:'Nunito',sans-serif;color:#e8e6f0;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
#webgl-fail{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;background:#000;color:#e8e6f0}
#webgl-fail.show{display:flex}

/* 过渡：透明（桌面）→ 黑 → 游戏 */
#fade{position:fixed;inset:0;z-index:60;background:#000;pointer-events:none;animation:introFade 4.2s ease forwards}
#fade .fade-title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;animation:titleIn 4.2s ease forwards}
#fade .fade-title .t{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(44px,9vw,100px);letter-spacing:.04em;color:#fff;text-shadow:0 0 40px rgba(245,126,182,.5)}
#fade .fade-title .s{font-family:'Song Myung',serif;margin-top:14px;font-size:14px;letter-spacing:.3em;color:rgba(255,255,255,.7)}
@keyframes introFade{0%{opacity:0}35%{opacity:1}75%{opacity:1}100%{opacity:0}}
@keyframes titleIn{0%{opacity:0;transform:scale(.97)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}

/* 指针锁定提示 */
#lock{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75);transition:opacity .5s ease;cursor:pointer}
#lock.hidden{opacity:0;pointer-events:none}
#lock .box{text-align:center;padding:30px}
#lock .t{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;letter-spacing:.08em}
#lock .s{margin-top:12px;font-family:'Song Myung',serif;font-size:14px;letter-spacing:.2em;color:rgba(255,255,255,.7)}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:10px;padding:16px 20px;pointer-events:none;transition:opacity .5s ease}
#hud.hidden{opacity:0}
.hud-item{font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;letter-spacing:.18em;color:#fff;background:rgba(10,10,18,.55);border:1px solid rgba(245,126,182,.3);border-radius:999px;padding:8px 16px}
.hud-obj{margin-left:auto;color:#f9a8d4}
#toast{position:fixed;left:50%;bottom:14%;transform:translateX(-50%);z-index:12;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;letter-spacing:.16em;color:#fff;background:rgba(10,10,18,.72);border:1px solid rgba(245,126,182,.5);border-radius:999px;padding:10px 22px;pointer-events:none;opacity:0;transition:opacity .25s ease}
#toast.show{opacity:1}

/* 终点 */
#end{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .8s ease}
#end.hidden{opacity:0;pointer-events:none}
#end .t{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(34px,7vw,72px);color:#fff;letter-spacing:.06em;text-shadow:0 0 40px rgba(245,126,182,.5)}
#end .s{margin-top:16px;font-family:'Song Myung',serif;font-size:15px;letter-spacing:.2em;color:rgba(255,255,255,.7)}
#end .again{margin-top:40px;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;letter-spacing:.2em;color:#f57eb6;cursor:pointer;border-bottom:1px solid rgba(245,126,182,.4)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="fade"><div class="fade-title"><div class="t">DREAMSIDE</div><div class="s">你醒在一个不该醒来的房间</div></div></div>
<div id="webgl-fail"><div>你的浏览器没有开启 WebGL。</div></div>

<div id="hud" class="hidden">
  <div class="hud-item">DREAMSIDE · 第一人称</div>
  <div class="hud-item hud-obj" id="hud-obj">找到钥匙，离开这里</div>
</div>
<div id="toast"></div>

<div id="lock">
  <div class="box">
    <div class="t">点击进入房间</div>
    <div class="s">鼠标转动视角 · WASD 移动 · E 交互 · F 手电</div>
  </div>
</div>

<div id="end" class="hidden">
  <div class="t">YOU GOT OUT</div>
  <div class="s">门在身后关上了。</div>
  <div class="again" id="again">↺ 再来一次</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* 恐怖背景音乐：换成你自己的恐怖音频文件 */
const HORROR_BGM_URL = 'assets/horror.mp3';

/* ---------------- 音效引擎 ---------------- */
let AC = null, noiseBuf = null;
function initAudio(){
  if(AC) return;
  try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
  if(AC && AC.state === 'suspended') AC.resume();
}
function getNoise(){
  if(!AC) return null;
  if(noiseBuf) return noiseBuf;
  noiseBuf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return noiseBuf;
}
function tone(f, dur, type, vol, slideTo){
  if(!AC) return;
  const t0 = AC.currentTime, o = AC.createOscillator(); o.type = type||'sine';
  o.frequency.setValueAtTime(f, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol||0.2, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0+dur+0.05);
}
function noiseHit(dur, vol, type, f0, f1){
  if(!AC) return;
  const t0 = AC.currentTime, src = AC.createBufferSource(); src.buffer = getNoise();
  const f = AC.createBiquadFilter(); f.type = type||'lowpass';
  f.frequency.setValueAtTime(f0||800, t0);
  if(f1) f.frequency.exponentialRampToValueAtTime(f1, t0+dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol||0.2, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  src.connect(f).connect(g).connect(AC.destination); src.start(t0); src.stop(t0+dur+0.05);
}
// 恐怖低音持续 drone
let droneNodes = [];
function startDrone(){
  if(!AC) return;
  stopDrone();
  const g = AC.createGain(); g.gain.value = 0.0;
  g.gain.linearRampToValueAtTime(0.06, AC.currentTime + 2.0);
  [55, 55.7, 82.4, 110].forEach(f => {
    const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    const og = AC.createGain(); og.gain.value = 0.22;
    o.connect(og).connect(g);
    o.start();
    droneNodes.push(o, og);
  });
  const src = AC.createBufferSource(); src.buffer = getNoise(); src.loop = true;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
  const ng = AC.createGain(); ng.gain.value = 0.35;
  src.connect(lp).connect(ng).connect(g); src.start();
  droneNodes.push(src, lp, ng);
  g.connect(AC.destination); droneNodes.push(g);
}
function stopDrone(){ droneNodes.forEach(n => { try{ n.stop && n.stop(); }catch(e){} }); droneNodes = []; }
const SFX = {
  step(){ noiseHit(0.05, 0.08, 'lowpass', 300); },
  rattle(){ noiseHit(0.15, 0.2, 'bandpass', 1200, 800); tone(90, 0.12, 'square', 0.06); },
  pickup(){ tone(880, 0.15, 'sine', 0.12); setTimeout(()=>tone(1320,0.2,'sine',0.1), 90); },
  creak(){ tone(120, 0.8, 'sawtooth', 0.05, 60); },
  scare(){ noiseHit(0.4, 0.3, 'bandpass', 300, 1800); tone(70, 0.5, 'sawtooth', 0.12, 40); },
  escape(){ noiseHit(0.6, 0.3, 'bandpass', 400, 2400); tone(440, 0.6, 'sine', 0.1, 880); }
};

/* ---------------- 渲染器 / 场景 ---------------- */
const stage = document.getElementById('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true }); } catch(e){ renderer = null; }
if(!renderer){ document.getElementById('webgl-fail').classList.add('show'); throw new Error('WebGL unavailable'); }
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05050a, 0.06);
scene.background = new THREE.Color(0x05050a);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.05, 60);
camera.rotation.order = 'YXZ';
const EYE = 1.6;

/* ---------------- 程序化写实纹理 ---------------- */
function tex(w,h,fn){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function woodTex(){
  return tex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#2a1d12'; ctx.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=64){
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, y, w, 2);
      for(let i=0;i<w;i+=2){ const v = 40 + Math.random()*30; ctx.fillStyle = `rgba(${v*0.4},${v*0.26},${v*0.14},0.15)`; ctx.fillRect(i, y, 2, 64); }
    }
  });
}
function wallTex(){
  return tex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#15131c'; ctx.fillRect(0,0,w,h);
    for(let i=0;i<4000;i++){ const v = Math.random()*14; ctx.fillStyle = `rgba(${v},${v},${v+8},0.06)`; ctx.fillRect(Math.random()*w, Math.random()*h, 2, 2); }
  });
}
const floorTex = woodTex(); floorTex.repeat.set(3,3);
const wallTexT = wallTex(); wallTexT.repeat.set(4,2);

function roomPart(w, h, d, mat){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); }

/* ---------------- 房间（写实昏暗） ---------------- */
const solids = [];   // 2D 碰撞 {minx,minz,maxx,maxz}
function addSolidBox(mesh, minx, minz, maxx, maxz){ scene.add(mesh); solids.push({ minx, minz, maxx, maxz }); }

const wallMat = new THREE.MeshStandardMaterial({ map:wallTexT, roughness:0.95, metalness:0.05 });
const floorMat = new THREE.MeshStandardMaterial({ map:floorTex, roughness:0.9, metalness:0.05 });
const ceilMat = new THREE.MeshStandardMaterial({ color:0x0c0a12, roughness:1 });

// 地板 / 天花板
const floor = roomPart(8, 0.2, 8, floorMat); floor.position.set(0, -0.1, 0); scene.add(floor);
const ceil = roomPart(8, 0.2, 8, ceilMat); ceil.position.set(0, 3.0, 0); scene.add(ceil);

// 墙（南墙留门洞）
function wallAt(x, y, z, w, h, d){ const m = roomPart(w,h,d,wallMat); m.position.set(x,y,z); return m; }
addSolidBox(wallAt(0, 1.5, 4, 8, 3, 0.3), -4, 3.85, 4, 4.3);            // 北
addSolidBox(wallAt(-4, 1.5, 0, 0.3, 3, 8), -4.3, -4, -4, 4);          // 西
addSolidBox(wallAt(4, 1.5, 0, 0.3, 3, 8), 4, -4, 4.3, 4);             // 东
// 南墙两段（门洞在 x 0.5..1.7）
addSolidBox(wallAt(-1.75, 1.5, -4, 3.5, 3, 0.3), -4, -4.3, 0.5, -4);
addSolidBox(wallAt(2.85, 1.5, -4, 3.5, 3, 0.3), 1.7, -4.3, 4, -4);

// 门（在门洞处）
const doorGroup = new THREE.Group();
const door = roomPart(1.2, 2.4, 0.08, new THREE.MeshStandardMaterial({ color:0x241a14, roughness:0.8, metalness:0.1 }));
door.position.set(0.6, 0, -0.02); doorGroup.add(door);
const doorknob = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), new THREE.MeshStandardMaterial({ color:0x8a6a3a, metalness:0.8, roughness:0.3 }));
doorknob.position.set(0.6, 0.02, 0.06); doorGroup.add(doorknob);
doorGroup.position.set(0.5, 1.2, -3.85); scene.add(doorGroup);
let doorOpen = false;

// 窗户（东墙，月光）
const windowFrame = roomPart(0.1, 1.4, 2.0, new THREE.MeshStandardMaterial({ color:0x1a1410, roughness:0.8 }));
windowFrame.position.set(3.85, 1.8, -1); scene.add(windowFrame);
const windowGlass = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 1.4), new THREE.MeshBasicMaterial({ color:0x9fb8d8, transparent:true, opacity:0.18 }));
windowGlass.position.set(3.88, 1.8, -1); windowGlass.rotation.y = Math.PI/2; scene.add(windowGlass);

// 桌子 + 钥匙
const table = roomPart(1.6, 0.06, 0.9, new THREE.MeshStandardMaterial({ color:0x2a1e14, roughness:0.85 }));
table.position.set(-1.6, 0.75, -1.2); scene.add(table);
addSolidBox(table, -2.4, -1.65, -0.8, -0.75);
for(let i=0;i<4;i++){ const leg = roomPart(0.07,0.75,0.07, new THREE.MeshStandardMaterial({ color:0x241a12 })); leg.position.set(-1.6 + (i%2?0.72:-0.72), 0.37, -1.2 + (i<2?-0.4:0.4)); scene.add(leg); }

const key = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.02, 0.16), new THREE.MeshStandardMaterial({ color:0xd9c07a, emissive:0x8a6a3a, emissiveIntensity:0.6, metalness:0.7, roughness:0.3 }));
key.position.set(-1.6, 0.82, -1.2); scene.add(key);
let hasKey = false;

// 柜子
const cabinet = roomPart(1.2, 2.0, 0.6, new THREE.MeshStandardMaterial({ color:0x1c1612, roughness:0.85 }));
cabinet.position.set(2.6, 1.0, 2.4); scene.add(cabinet);
addSolidBox(cabinet, 2.0, 2.1, 3.2, 2.7);

// 灯（闪烁）
const lampShade = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.3, 16, 1, true), new THREE.MeshStandardMaterial({ color:0x2a1e14, roughness:0.8, side:THREE.DoubleSide }));
lampShade.position.set(1.6, 1.5, 1.4); scene.add(lampShade);
const lampLight = new THREE.PointLight(0xffc47a, 1.0, 9, 1.8);
lampLight.position.set(1.6, 1.5, 1.4); scene.add(lampLight);

// 阴影人形（微恐惊吓）
const figure = new THREE.Group();
const fBody = roomPart(0.5, 1.5, 0.3, new THREE.MeshStandardMaterial({ color:0x000000, roughness:1 }));
fBody.position.y = 0.85; figure.add(fBody);
const fHead = roomPart(0.32, 0.32, 0.3, new THREE.MeshStandardMaterial({ color:0x000000, roughness:1 }));
fHead.position.y = 1.8; figure.add(fHead);
figure.visible = false; scene.add(figure);

/* ---------------- 灯光 ---------------- */
scene.add(new THREE.HemisphereLight(0x8a9ae0, 0x0a0a12, 0.12));
const moonLight = new THREE.DirectionalLight(0x9fb8d8, 0.6);
moonLight.position.set(6, 5, -1); scene.add(moonLight);

/* ---------------- 第一人称控制 ---------------- */
const pPos = new THREE.Vector3(0, 0, 3.2);
let yaw = Math.PI, pitch = 0, hasPointer = false, lastStep = 0;
function circleHit(px, pz, r){
  for(const s of solids){
    const cx = Math.max(s.minx, Math.min(px, s.maxx));
    const cz = Math.max(s.minz, Math.min(pz, s.maxz));
    const dx = px - cx, dz = pz - cz;
    if(dx*dx + dz*dz < r*r) return true;
  }
  return false;
}

const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup', e => keys[e.code] = false);

document.addEventListener('mousemove', e => {
  if(!document.pointerLockElement) return;
  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-1.4, Math.min(1.4, pitch));
});

/* ---------------- 交互 ---------------- */
const interactables = [
  { pos:new THREE.Vector3(-1.6,0.8,-1.2), label:'拾取钥匙', active:()=>!hasKey, act:()=>{ hasKey = true; key.visible = false; SFX.pickup(); toast('捡到一把生锈的钥匙'); updateObjective(); } },
  { pos:new THREE.Vector3(0.5,0,-3.6), label:'开门', active:()=>true, act:()=>{ if(!hasKey){ SFX.rattle(); toast('门是锁着的'); } else { openDoor(); } } }
];
let near = null;
function checkInteract(){
  near = null; let bd = 1.8;
  for(const it of interactables){
    if(it.active && !it.active()) continue;
    const d = pPos.distanceTo(it.pos);
    if(d < bd){ bd = d; near = it; }
  }
  const t = document.getElementById('toast');
  if(near){ t.textContent = 'E · ' + near.label; t.classList.add('show'); }
  else if(!t.dataset.msg) t.classList.remove('show');
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show'); t.dataset.msg = '1';
  clearTimeout(t._tm); t._tm = setTimeout(()=>{ t.classList.remove('show'); delete t.dataset.msg; }, 1800);
}
function updateObjective(){
  document.getElementById('hud-obj').textContent = hasKey ? '用钥匙打开那扇门' : '找到钥匙，离开这里';
}
function openDoor(){
  doorOpen = true; SFX.escape();
  doorGroup.rotation.y = Math.PI/2;
  document.getElementById('end').classList.remove('hidden');
  document.exitPointerLock && document.exitPointerLock();
}

/* ---------------- 恐怖氛围调度 ---------------- */
let flickerT = 0, nextCreak = 0, nextScare = 0;
function updateHorror(dt, t){
  // 灯闪烁
  flickerT += dt;
  if(flickerT > 0.4 + Math.random()*3){
    flickerT = 0;
    lampLight.intensity = Math.random() < 0.2 ? 0.05 : (0.7 + Math.random()*0.6);
  }
  // 门轴吱呀
  if(t > nextCreak){ nextCreak = t + 8000 + Math.random()*14000; SFX.creak(); }
  // 阴影人形
  if(t > nextScare){
    nextScare = t + 16000 + Math.random()*18000;
    const cx = [-3.2, 3.2][(Math.random()*2)|0];
    const cz = [-3.2, 2.8][(Math.random()*2)|0];
    const dx = pPos.x - cx, dz = pPos.z - cz;
    if(dx*dx + dz*dz < 9) return;   // 太近就不出现
    figure.position.set(cx, 0, cz);
    figure.rotation.y = Math.atan2(dx, dz);
    figure.visible = true;
    lampLight.intensity = 0.05;
    SFX.scare();
    setTimeout(()=>{ figure.visible = false; }, 1400);
  }
}

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
function animate(){
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = performance.now();

  if(hasPointer){
    const f = -Math.sin(yaw), r = Math.cos(yaw);
    const bz = -Math.cos(yaw), rz = -Math.sin(yaw);
    let mx = 0, mz = 0;
    const spd = keys['ShiftLeft'] ? 1.4 : 2.4;
    if(keys['KeyW']){ mx += f; mz += bz; }
    if(keys['KeyS']){ mx -= f; mz -= bz; }
    if(keys['KeyA']){ mx -= r; mz -= rz; }
    if(keys['KeyD']){ mx += r; mz += rz; }
    if(mx || mz){ const l = Math.hypot(mx,mz); mx/=l; mz/=l; }

    const nx = pPos.x + mx*spd*dt;
    if(!circleHit(nx, pPos.z, 0.35)) pPos.x = nx;
    const nz = pPos.z + mz*spd*dt;
    if(!circleHit(pPos.x, nz, 0.35)) pPos.z = nz;

    if((mx||mz) && t - lastStep > 380){ lastStep = t; SFX.step(); }

    camera.position.set(pPos.x, EYE, pPos.z);
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
    checkInteract();
  }

  updateHorror(dt, t);
  key.rotation.y += dt * 1.5;
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

/* ---------------- 事件：锁定 / 交互 / 手电 ---------------- */
document.getElementById('lock').addEventListener('click', () => {
  initAudio(); startDrone();
  document.getElementById('lock').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  hasPointer = document.pointerLockElement === renderer.domElement;
  if(!hasPointer && !doorOpen && !document.getElementById('lock').classList.contains('hidden') === false){
    // 未解锁时重新显示提示
    if(!document.getElementById('end').classList.contains('hidden')) return;
    if(hasKey || true){ /* keep playing without lock is fine */ }
  }
});
addEventListener('keydown', e => {
  if(e.code === 'KeyE' && near && hasPointer){ near.act(); }
  if(e.code === 'KeyF'){ /* 手电：微弱跟随光（简化） */ }
});
document.getElementById('again').addEventListener('click', () => location.reload());

addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
