<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UDG Style MV</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
}

#container {
  width: 100%;
  height: 100%;
  position: relative;
}

#canvas3d {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

#noise-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0.15;
  z-index: 5;
  mix-blend-mode: overlay;
  pointer-events: none;
}

#lyric-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.lyric-layer {
  position: absolute;
  font-size: 120px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -2px;
  white-space: nowrap;
  text-align: center;
}

#glitch-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 15;
  pointer-events: none;
  mix-blend-mode: screen;
}
</style>
</head>
<body>
<div id="container">
  <canvas id="canvas3d"></canvas>
  <canvas id="noise-layer"></canvas>
  <div id="lyric-container"></div>
  <canvas id="glitch-canvas"></canvas>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js';

// === LYRICS DATA ===
const LYRICS = [
  {time: 21.928, text: "我试着不去猜"},
  {time: 23.12, text: "我试着不去期待"},
  {time: 24.409, text: "好像又遭遇些"},
  {time: 25.56, text: "你故意清除的空白"},
  {time: 27.002, text: "我没有质疑你"},
  {time: 28.401, text: "只是问题在这"},
  {time: 29.695, text: "可是你把它当作"},
  {time: 30.799, text: "我和你最后决赛"},
  {time: 32.541, text: "别让我在你面前"},
  {time: 33.771, text: "就失态"},
  {time: 34.987, text: "别对我敲连击"},
  {time: 36.065, text: "把我击倒"},
  {time: 37.375, text: "不要这样就"},
  {time: 38.641, text: "不要躲着我"},
  {time: 39.888, text: "就别抱紧我"},
  {time: 41.126, text: "woah"},
  {time: 42.421, text: "你总说你没有做"},
  {time: 43.356, text: "你总说你拯救我"},
  {time: 44.91, text: "全都是bullshxt"},
  {time: 45.959, text: "你从来没救赎过"},
  {time: 47.422, text: "逃避的人是我"},
  {time: 48.523, text: "不说话的也是我"},
  {time: 49.784, text: "好像什么都是我"},
  {time: 51.077, text: "好像什么都该我"},
  {time: 52.901, text: "别让我在你面前"},
  {time: 54.223, text: "就失态"},
  {time: 55.421, text: "别对我敲连击"},
  {time: 56.408, text: "把我击倒"},
  {time: 57.753, text: "不要这样就"},
  {time: 59.071, text: "不要躲着我"},
  {time: 60.346, text: "就别抱紧我"},
  {time: 61.611, text: "woah"},
  {time: 63.481, text: "好像我们曾经相识"},
  {time: 65.357, text: "好像很久很久我们就已相识"},
  {time: 67.937, text: "可我们还要伤害彼此像是将士"},
  {time: 70.353, text: "你自己也不知道自己会变这样子"},
  {time: 73.256, text: "我的心像大雨落下"},
  {time: 75.875, text: "你对我说的话有真有假"},
  {time: 78.781, text: "就别再想着跟我说谎话"}
];

// === SCENE SETUP ===
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, 1920/1080, 0.1, 1000);
camera.position.z = 5;

const canvas3d = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: false, alpha: true });
renderer.setSize(1920, 1080);

// === DYNAMIC BACKGROUND COLORS ===
function getBackgroundColor(time) {
  // 0-10s: Light gray with noise
  if (time < 10) return new THREE.Color(0xd0d0d0);
  // 10-22s: Shift to cyan
  if (time < 22) {
    const t = (time - 10) / 12;
    return new THREE.Color().lerpColors(
      new THREE.Color(0xd0d0d0),
      new THREE.Color(0x4dd9ff),
      t
    );
  }
  // 22-42s: Cyan with variations
  if (time < 42) {
    const pulse = Math.sin(time * 3) * 0.1;
    return new THREE.Color(0x4dd9ff).offsetHSL(0, 0, pulse);
  }
  // 42-52s: Shift to purple/pink
  if (time < 52) {
    const t = (time - 42) / 10;
    return new THREE.Color().lerpColors(
      new THREE.Color(0x4dd9ff),
      new THREE.Color(0xff00ff),
      t
    );
  }
  // 52-63s: Purple/magenta chaos
  if (time < 63) {
    const flash = Math.sin(time * 10) > 0.7 ? 0.3 : 0;
    return new THREE.Color(0xff00ff).offsetHSL(0, 0, flash);
  }
  // 63-73s: Multi-color shift
  if (time < 73) {
    const hue = (time - 63) / 10;
    return new THREE.Color().setHSL(hue, 0.8, 0.6);
  }
  // 73-79s: Yellow/green
  if (time < 79) {
    return new THREE.Color(0xcfff04);
  }
  // 79+: Fade to dark gray
  return new THREE.Color(0x1a1a1a);
}

// === 3D OBJECTS SYSTEM ===
const objectSets = [];
let currentSet = null;

// Simple geometric shapes
function createGeometricSet() {
  const set = [];

  // Large rectangles (like frame 1)
  for (let i = 0; i < 5; i++) {
    const geo = new THREE.BoxGeometry(0.3, 4, 0.1);
    const mat = new THREE.MeshBasicMaterial({
      color: 0xcfff04,
      transparent: true,
      opacity: 0.9
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.x = (i - 2) * 1.5;
    mesh.position.z = -5;
    set.push(mesh);
    scene.add(mesh);
  }

  return set;
}

// Abstract 3D shapes
function createAbstractSet() {
  const set = [];

  // Low-poly sphere
  const sphereGeo = new THREE.IcosahedronGeometry(2, 1);
  const sphereMat = new THREE.MeshBasicMaterial({
    color: 0x0066ff,
    wireframe: false,
    transparent: true,
    opacity: 0.8
  });
  const sphere = new THREE.Mesh(sphereGeo, sphereMat);
  set.push(sphere);
  scene.add(sphere);

  // Rings
  for (let i = 0; i < 3; i++) {
    const ringGeo = new THREE.TorusGeometry(2.5 + i * 0.3, 0.05, 8, 32);
    const ringMat = new THREE.MeshBasicMaterial({
      color: [0xffffff, 0x00ffff, 0xff00ff][i],
      transparent: true,
      opacity: 0.6
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2 + (i * 0.3);
    set.push(ring);
    scene.add(ring);
  }

  return set;
}

// Tunnel/perspective effect
function createTunnelSet() {
  const set = [];

  for (let i = 0; i < 20; i++) {
    const size = 3 - (i * 0.1);
    const geo = new THREE.RingGeometry(size, size + 0.1, 4);
    const hue = i / 20;
    const mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color().setHSL(hue, 0.8, 0.5),
      side: THREE.DoubleSide
    });
    const ring = new THREE.Mesh(geo, mat);
    ring.position.z = -i * 0.5;
    set.push(ring);
    scene.add(ring);
  }

  return set;
}

// Particles/chaos
function createParticleSet() {
  const set = [];

  for (let i = 0; i < 50; i++) {
    const geo = new THREE.BoxGeometry(
      Math.random() * 0.3 + 0.1,
      Math.random() * 0.3 + 0.1,
      Math.random() * 0.3 + 0.1
    );
    const mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color().setHSL(Math.random(), 0.8, 0.5)
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(
      (Math.random() - 0.5) * 10,
      (Math.random() - 0.5) * 8,
      (Math.random() - 0.5) * 8
    );
    mesh.userData.velocity = {
      x: (Math.random() - 0.5) * 0.1,
      y: (Math.random() - 0.5) * 0.1,
      z: (Math.random() - 0.5) * 0.1
    };
    set.push(mesh);
    scene.add(mesh);
  }

  return set;
}

function clearCurrentSet() {
  if (currentSet) {
    currentSet.forEach(obj => scene.remove(obj));
    currentSet = null;
  }
}

function switchVisualSet(time) {
  // Switch visual styles based on time
  let targetSet = null;

  if (time < 22) targetSet = 'geometric';
  else if (time < 35) targetSet = 'abstract';
  else if (time < 50) targetSet = 'tunnel';
  else if (time < 65) targetSet = 'particles';
  else if (time < 73) targetSet = 'abstract';
  else targetSet = 'geometric';

  // Only switch if different
  if (!currentSet || currentSet.type !== targetSet) {
    clearCurrentSet();

    switch(targetSet) {
      case 'geometric':
        currentSet = createGeometricSet();
        break;
      case 'abstract':
        currentSet = createAbstractSet();
        break;
      case 'tunnel':
        currentSet = createTunnelSet();
        break;
      case 'particles':
        currentSet = createParticleSet();
        break;
    }

    if (currentSet) currentSet.type = targetSet;
  }
}

// === NOISE LAYER ===
const noiseCanvas = document.getElementById('noise-layer');
const noiseCtx = noiseCanvas.getContext('2d');
noiseCanvas.width = 1920;
noiseCanvas.height = 1080;

function drawNoise() {
  const imageData = noiseCtx.createImageData(1920, 1080);
  for (let i = 0; i < imageData.data.length; i += 4) {
    const value = Math.random() * 255;
    imageData.data[i] = value;
    imageData.data[i + 1] = value;
    imageData.data[i + 2] = value;
    imageData.data[i + 3] = 100;
  }
  noiseCtx.putImageData(imageData, 0, 0);
}

// === LYRIC SYSTEM WITH EFFECTS ===
const lyricContainer = document.getElementById('lyric-container');
let currentLyricIndex = -1;
const fonts = ['Arial', 'Impact', 'Helvetica', 'Arial Black'];
const fontWeights = [900, 700, 900, 900];

function updateLyric(time) {
  // Find current lyric
  let newIndex = -1;
  for (let i = 0; i < LYRICS.length; i++) {
    if (time >= LYRICS[i].time &&
        (i === LYRICS.length - 1 || time < LYRICS[i + 1].time)) {
      newIndex = i;
      break;
    }
  }

  // If lyric changed, create new layers
  if (newIndex !== currentLyricIndex && newIndex !== -1) {
    currentLyricIndex = newIndex;
    lyricContainer.innerHTML = '';

    const lyric = LYRICS[newIndex];
    const timeSinceChange = time - lyric.time;

    // Create 3-5 overlapping layers
    const numLayers = Math.floor(Math.random() * 3) + 3;

    for (let i = 0; i < numLayers; i++) {
      const layer = document.createElement('div');
      layer.className = 'lyric-layer';
      layer.textContent = lyric.text;

      // Random font from array
      const fontIndex = Math.floor(Math.random() * fonts.length);
      layer.style.fontFamily = fonts[fontIndex];
      layer.style.fontWeight = fontWeights[fontIndex];

      // Random size variation
      const sizeVariation = 120 + (Math.random() - 0.5) * 40;
      layer.style.fontSize = sizeVariation + 'px';

      // Random color (high saturation)
      const colors = ['#CFFF04', '#00FFFF', '#FF00FF', '#FFFFFF', '#0066FF'];
      layer.style.color = colors[Math.floor(Math.random() * colors.length)];

      // Random offset
      const offsetX = (Math.random() - 0.5) * 30;
      const offsetY = (Math.random() - 0.5) * 30;
      layer.style.transform = `translate(${offsetX}px, ${offsetY}px)`;

      // Random opacity
      layer.style.opacity = 0.6 + Math.random() * 0.4;

      // Glitch effect on new lyric
      if (timeSinceChange < 0.15) {
        const glitchX = (Math.random() - 0.5) * 100;
        const glitchY = (Math.random() - 0.5) * 100;
        layer.style.transform = `translate(${glitchX}px, ${glitchY}px)`;
        layer.style.opacity = Math.random() > 0.5 ? 1 : 0;
      }

      // Flicker effect
      const flickerChance = Math.sin(time * 30) > 0.8;
      if (flickerChance) {
        layer.style.opacity = Math.random();
      }

      lyricContainer.appendChild(layer);
    }
  } else if (newIndex === -1) {
    // No lyric, clear
    lyricContainer.innerHTML = '';
    currentLyricIndex = -1;
  }
}

// === GLITCH CANVAS ===
const glitchCanvas = document.getElementById('glitch-canvas');
const glitchCtx = glitchCanvas.getContext('2d');
glitchCanvas.width = 1920;
glitchCanvas.height = 1080;

function drawGlitchEffects(time) {
  glitchCtx.clearRect(0, 0, 1920, 1080);

  // Random horizontal bars
  if (Math.random() < 0.2) {
    const numBars = Math.floor(Math.random() * 8) + 2;
    for (let i = 0; i < numBars; i++) {
      const y = Math.random() * 1080;
      const height = Math.random() * 30 + 3;
      const offset = (Math.random() - 0.5) * 200;

      glitchCtx.fillStyle = `rgba(${Math.random() * 255}, ${Math.random() * 255}, ${Math.random() * 255}, ${Math.random() * 0.5})`;
      glitchCtx.fillRect(offset, y, 1920, height);
    }
  }

  // RGB split on beat
  const beatPulse = Math.abs(Math.sin(time * 8)) > 0.92;
  if (beatPulse) {
    const shift = 15;
    glitchCtx.globalCompositeOperation = 'screen';
    glitchCtx.fillStyle = 'rgba(255, 0, 0, 0.3)';
    glitchCtx.fillRect(shift, 0, 1920, 1080);
    glitchCtx.fillStyle = 'rgba(0, 255, 255, 0.3)';
    glitchCtx.fillRect(-shift, 0, 1920, 1080);
    glitchCtx.globalCompositeOperation = 'source-over';
  }

  // Random color blocks
  if (Math.random() < 0.15) {
    const numBlocks = Math.floor(Math.random() * 5) + 1;
    for (let i = 0; i < numBlocks; i++) {
      const x = Math.random() * 1920;
      const y = Math.random() * 1080;
      const w = Math.random() * 200 + 50;
      const h = Math.random() * 200 + 50;

      glitchCtx.fillStyle = `rgba(${Math.random() * 255}, ${Math.random() * 255}, ${Math.random() * 255}, ${Math.random() * 0.6})`;
      glitchCtx.fillRect(x, y, w, h);
    }
  }
}

// === ANIMATION LOOP ===
let lastTime = 0;

function animate(timestamp) {
  const currentTime = window.time !== undefined ? window.time : (timestamp / 1000);

  // Update background color
  const bgColor = getBackgroundColor(currentTime);
  scene.background = bgColor;

  // Switch visual set based on time
  switchVisualSet(currentTime);

  // Animate current objects
  if (currentSet) {
    currentSet.forEach((obj, i) => {
      // Rotation
      obj.rotation.x += 0.01 * (i % 3 + 1);
      obj.rotation.y += 0.015 * (i % 3 + 1);
      obj.rotation.z += 0.008 * (i % 3 + 1);

      // Pulse on beat
      const beatScale = 1 + Math.abs(Math.sin(currentTime * 4)) * 0.15;
      obj.scale.set(beatScale, beatScale, beatScale);

      // Particle movement
      if (obj.userData.velocity) {
        obj.position.x += obj.userData.velocity.x;
        obj.position.y += obj.userData.velocity.y;
        obj.position.z += obj.userData.velocity.z;

        // Wrap around
        if (Math.abs(obj.position.x) > 10) obj.position.x *= -1;
        if (Math.abs(obj.position.y) > 8) obj.position.y *= -1;
        if (Math.abs(obj.position.z) > 8) obj.position.z *= -1;
      }
    });
  }

  // Camera movement
  camera.position.z = 5 + Math.sin(currentTime * 0.5) * 1.5;
  camera.position.x = Math.sin(currentTime * 0.3) * 0.8;
  camera.position.y = Math.cos(currentTime * 0.2) * 0.5;
  camera.lookAt(0, 0, 0);

  // Render 3D scene
  renderer.render(scene, camera);

  // Update noise (every few frames)
  if (Math.random() < 0.3) {
    drawNoise();
  }

  // Update lyric
  updateLyric(currentTime);

  // Draw glitch effects
  drawGlitchEffects(currentTime);

  lastTime = currentTime;
  requestAnimationFrame(animate);
}

// Start animation
animate(0);

console.log('UDG Style MV initialized');
console.log('Set window.time to control playback');
</script>
</body>
</html>
