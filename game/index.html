<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DREAMSIDE // 像素闯关</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============ Porter Robinson 风 · 梦幻渐变基底 ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:linear-gradient(180deg,#c7d6ff 0%,#f3d0ff 38%,#ffd9e8 66%,#ffe9c9 100%);
  overflow:hidden;
  font-family:'JetBrains Mono',monospace;
  -webkit-font-smoothing:antialiased;
  color:#4a3b5c;
}
#stage{position:fixed;inset:0}
#stage canvas{display:block}

/* 柔光晕：漂浮的氛围色斑 */
.aura{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none;z-index:1}
.aura.a1{width:46vw;height:46vw;left:-10vw;top:-12vw;background:radial-gradient(circle,#ffffff 0%,transparent 65%)}
.aura.a2{width:40vw;height:40vw;right:-8vw;bottom:-10vw;background:radial-gradient(circle,#ffc9e0 0%,transparent 70%)}
.aura.a3{width:34vw;height:34vw;left:40vw;top:30vh;background:radial-gradient(circle,#c9fff0 0%,transparent 70%);opacity:.4}

/* ============ 覆盖层通用 ============ */
.overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);transition:opacity .6s ease,visibility .6s ease}
.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.kicker{font-size:12px;letter-spacing:.42em;color:rgba(74,59,92,.65);text-transform:uppercase}
.title{font-family:'Archivo Black',system-ui,sans-serif;font-size:clamp(44px,9vw,110px);line-height:.92;letter-spacing:.04em;color:#fff;margin-top:14px;text-shadow:0 8px 40px rgba(120,90,160,.35)}
.sub{margin-top:22px;font-size:14px;letter-spacing:.28em;color:rgba(74,59,92,.72)}
.start-hint{margin-top:46px;font-size:12px;letter-spacing:.3em;color:#fff;background:rgba(255,255,255,.28);padding:14px 26px;border-radius:999px;animation:hintPulse 1.8s ease-in-out infinite;cursor:pointer;border:1px solid rgba(255,255,255,.5)}
@keyframes hintPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.05);opacity:1}}
.controls{margin-top:34px;font-size:11px;letter-spacing:.12em;color:rgba(74,59,92,.55);line-height:2}
.controls b{color:#fff;text-shadow:0 1px 6px rgba(74,59,92,.5)}

/* ============ 故障字（标题） ============ */
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;overflow:hidden}
.glitch::before{color:#7de8ff;z-index:-1;animation:gl1 2.4s infinite linear alternate-reverse;transform:translate(-2px,0)}
.glitch::after{color:#ff9cc9;z-index:-2;animation:gl2 3.1s infinite linear alternate-reverse;transform:translate(2px,0)}
@keyframes gl1{0%,86%,100%{clip-path:inset(0 0 92% 0)}12%{clip-path:inset(34% 0 40% 0)}30%{clip-path:inset(70% 0 8% 0)}48%{clip-path:inset(12% 0 66% 0)}64%{clip-path:inset(52% 0 28% 0)}}
@keyframes gl2{0%,90%,100%{clip-path:inset(88% 0 2% 0)}10%{clip-path:inset(18% 0 60% 0)}28%{clip-path:inset(60% 0 18% 0)}44%{clip-path:inset(40% 0 40% 0)}70%{clip-path:inset(8% 0 74% 0)}}

/* ============ HUD ============ */
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;pointer-events:none;transition:opacity .4s ease,transform .4s ease}
#hud.hidden{opacity:0;transform:translateY(-10px)}
.hud-item{font-size:11px;letter-spacing:.22em;color:#fff;text-shadow:0 2px 10px rgba(74,59,92,.4);background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:8px 16px;backdrop-filter:blur(8px)}
.hud-item.btn{pointer-events:auto;cursor:pointer;transition:background .25s ease}
.hud-item.btn:hover{background:rgba(255,255,255,.4)}

/* ============ 触摸按键 ============ */
#touch{position:fixed;inset:auto 0 0 0;z-index:12;display:none;justify-content:space-between;align-items:flex-end;padding:20px;pointer-events:none}
.tbtn{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.25);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-tap-highlight-color:transparent;user-select:none}
.tbtn:active{background:rgba(255,255,255,.5)}
.tcluster{display:flex;gap:12px}
@media(pointer:coarse){#touch{display:flex}}

/* ============ 通关横幅 ============ */
#banner{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .4s ease}
#banner.show{opacity:1;visibility:visible}
#banner .msg{font-family:'Archivo Black',sans-serif;font-size:clamp(30px,6vw,60px);color:#fff;letter-spacing:.08em;text-shadow:0 10px 40px rgba(120,90,160,.5);transform:translateY(20px);transition:transform .5s cubic-bezier(.16,1,.3,1)}
#banner.show .msg{transform:none}
</style>
</head>
<body>
<div class="aura a1"></div>
<div class="aura a2"></div>
<div class="aura a3"></div>

<div id="stage"></div>

<div id="hud" class="hidden">
  <div class="hud-item" id="hud-level">GARDEN // 01</div>
  <div class="hud-item btn" id="hud-music" title="音乐开关">♪ ON</div>
</div>

<div id="banner"><div class="msg" id="banner-msg">LEVEL CLEAR</div></div>

<div class="overlay" id="title">
  <div class="kicker">MAKE STUDIO · a pixel dream</div>
  <div class="title glitch" data-text="DREAMSIDE">DREAMSIDE</div>
  <div class="sub">闯关 · 像素小人 · 第三人称</div>
  <div class="start-hint" id="start-btn">CLICK / SPACE 开始</div>
  <div class="controls">
    <b>← → / A D</b> 移动 &nbsp;·&nbsp; <b>SPACE / ↑ / W</b> 跳跃<br>
    踩到尖刺或掉落会回到起点
  </div>
</div>

<div class="overlay hidden" id="final">
  <div class="kicker">SIGNAL // END</div>
  <div class="title glitch" data-text="YOU WOKE UP">YOU WOKE UP</div>
  <div class="sub">谢谢你走完这场梦。</div>
  <div class="start-hint" id="again-btn">再来一次</div>
</div>

<div id="touch">
  <div class="tcluster">
    <div class="tbtn" data-key="left">◀</div>
    <div class="tbtn" data-key="right">▶</div>
  </div>
  <div class="tbtn" data-key="jump">▲</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
 * 配置区：换背景音乐，改这里
 * 把你的「伴奏」文件放进 /assets/ 并命名为 bgm.mp3
 * 或直接改下面的路径（相对 game/index.html）
 * ============================================================ */
var BGM_URL = '../assets/bgm.mp3';

/* ---------- 像素小人（12×16，字符 → 颜色） ---------- */
var SPRITE_ROWS = [
  '....HHHH....',
  '...HHHHHH...',
  '...HHHHHH...',
  '...SSSSSS...',
  '...SESESS...',
  '...SSSSSS...',
  '....SSSS....',
  '..BBBBBBBB..',
  '..BBBBBBBB..',
  '.BBBBBBBBBB.',
  '.BBBBBBBBBB.',
  '...BB..BB...',
  '...LL..LL...',
  '...LL..LL...',
  '..LLL..LLL..',
  '..LL....LL..'
];
var SPRITE_PAL = {
  H:'#5a3b5c', /* 头发 */
  S:'#ffe0cc', /* 皮肤 */
  E:'#2b1b2e', /* 眼睛 */
  B:'#ff8fb3', /* 上衣 */
  L:'#5b5b8a'  /* 裤子 */
};

var GRAVITY = 1200, JUMP = -540, SPEED = 240;
var WORLD_H = 600, GROUND_Y = 500;

/* ---------- 关卡数据 ---------- */
var LEVELS = [
  {
    name:'GARDEN // 01',
    ground:[{x:0,w:3200}],
    platforms:[
      {x:600,y:400,w:150},{x:900,y:300,w:150},{x:1250,y:370,w:150},
      {x:1550,y:260,w:130},{x:1850,y:330,w:150},{x:2150,y:240,w:130},
      {x:2450,y:340,w:150},{x:2750,y:270,w:150}
    ],
    spikes:[{x:1120,w:70},{x:2050,w:80},{x:2350,w:70}],
    moving:[],
    goal:{x:3050}
  },
  {
    name:'SKY // 02',
    ground:[{x:0,w:1200},{x:1400,w:1200},{x:2850,w:350}],
    platforms:[
      {x:1240,y:430,w:120},{x:2620,y:430,w:120},{x:2690,y:350,w:110},
      {x:600,y:380,w:150},{x:1750,y:320,w:150},{x:2150,y:250,w:140}
    ],
    spikes:[{x:700,w:70},{x:1800,w:80},{x:2350,w:70},{x:2950,w:70}],
    moving:[{x:2000,y:360,w:120,to:2220,dur:2200}],
    goal:{x:3070}
  },
  {
    name:'VOID // 03',
    ground:[{x:0,w:900},{x:1120,w:680},{x:2020,w:580},{x:2820,w:380}],
    platforms:[
      {x:960,y:430,w:120},{x:1880,y:430,w:120},{x:2720,y:430,w:120},
      {x:760,y:330,w:130},{x:1500,y:300,w:150},{x:2300,y:280,w:140},
      {x:1700,y:180,w:130}
    ],
    spikes:[{x:520,w:80},{x:1350,w:70},{x:2100,w:70},{x:2400,w:70}],
    moving:[{x:2900,y:360,w:120,to:3080,dur:1800}],
    goal:{x:3100}
  }
];

/* ---------- 生成像素纹理 ---------- */
function makePixelTexture(scene, key, rows, pal, scale){
  if(scene.textures.exists(key)) return;
  var w = rows[0].length, h = rows.length;
  var c = document.createElement('canvas');
  c.width = w * scale; c.height = h * scale;
  var ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  for(var y=0;y<h;y++){
    for(var x=0;x<w;x++){
      var col = pal[rows[y][x]];
      if(!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x*scale, y*scale, scale, scale);
    }
  }
  scene.textures.addCanvas(key, c);
}

function makeGlowTexture(scene, key, color, size){
  if(scene.textures.exists(key)) return;
  var c = document.createElement('canvas');
  c.width = size; c.height = size;
  var ctx = c.getContext('2d');
  var g = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,size,size);
  scene.textures.addCanvas(key, c);
}

/* ---------- 游戏场景 ---------- */
class GameScene extends Phaser.Scene {
  constructor(){ super('game'); }

  preload(){
    makePixelTexture(this, 'hero', SPRITE_ROWS, SPRITE_PAL, 2);
    makeGlowTexture(this, 'petal', 'rgba(255,255,255,0.9)', 24);
    makeGlowTexture(this, 'goal', 'rgba(120,90,220,0.9)', 64);
    this.load.audio('bgm', BGM_URL);
  }

  create(){
    var lv = this.registry.get('level') || 0;
    var L = LEVELS[Math.min(lv, LEVELS.length-1)];

    /* 世界边界与摄像机 */
    this.physics.world.setBounds(0, 0, 3200, WORLD_H + 400);
    this.cameras.main.setBounds(0, 0, 3200, WORLD_H);
    this.cameras.main.setBackgroundColor('rgba(0,0,0,0)');

    /* 远景（视差） */
    this.add.rectangle(900, GROUND_Y-90, 700, 160, 0xf0e0ff, 0.5).setOrigin(.5,.5).setScrollFactor(0.25);
    this.add.rectangle(2100, GROUND_Y-120, 800, 200, 0xffe0ec, 0.4).setOrigin(.5,.5).setScrollFactor(0.35);

    /* 实心地面 + 浮空平台 */
    this.solids = [];
    var g = this.add.graphics();
    L.ground.forEach(function(seg){
      var r = this.add.rectangle(seg.x + seg.w/2, GROUND_Y + 40, seg.w, 80, 0xb7e0c8).setOrigin(.5,.5);
      this.physics.add.existing(r, true);
      this.solids.push(r);
      g.fillStyle(0xd9f2e2, 1);
      g.fillRect(seg.x, GROUND_Y-3, seg.w, 6);
    }, this);
    L.platforms.forEach(function(p){
      var r = this.add.rectangle(p.x + p.w/2, p.y + 12, p.w, 24, 0xb7a6e8).setOrigin(.5,.5);
      this.physics.add.existing(r, true);
      this.solids.push(r);
      g.fillStyle(0xe8dffc, 1);
      g.fillRect(p.x, p.y, p.w, 5);
    }, this);

    /* 尖刺（视觉三角 + 隐形判定盒） */
    this.hazards = [];
    var sg = this.add.graphics();
    sg.fillStyle(0xff6b8a, 1);
    L.spikes.forEach(function(s){
      var hb = this.add.rectangle(s.x + s.w/2, GROUND_Y - 8, s.w, 16, 0xff0000, 0).setOrigin(.5,.5);
      this.physics.add.existing(hb, true);
      this.hazards.push(hb);
      var teeth = Math.max(1, Math.floor(s.w / 22));
      var tw = s.w / teeth;
      for(var i=0;i<teeth;i++){
        var x0 = s.x + i*tw;
        sg.fillTriangle(x0, GROUND_Y, x0 + tw/2, GROUND_Y - 22, x0 + tw, GROUND_Y);
      }
    }, this);

    /* 移动平台 */
    this.moving = [];
    L.moving.forEach(function(m){
      var p = this.add.rectangle(m.x + m.w/2, m.y + 12, m.w, 24, 0xc9a6e8).setOrigin(.5,.5);
      this.physics.add.existing(p);
      p.body.setImmovable(true);
      p.body.allowGravity = false;
      this.moving.push(p);
      this.tweens.add({ targets:p, x:m.to, yoyo:true, repeat:-1, duration:m.dur, ease:'Sine.easeInOut' });
    }, this);
    if(this.moving.length) this.solids = this.solids.concat(this.moving);

    /* 终点门 */
    this.goal = this.add.image(L.goal.x, GROUND_Y - 34, 'goal').setOrigin(.5,1).setScale(1.4);
    this.physics.add.existing(this.goal, true);

    /* 玩家 */
    this.player = this.physics.add.sprite(90, GROUND_Y - 40, 'hero');
    this.player.setCollideWorldBounds(true);
    this.player.body.setSize(20, 30);
    this.player.body.setOffset(2, 2);

    this.physics.add.collider(this.player, this.solids);
    this.physics.add.overlap(this.player, this.hazards, function(){ this.die(); }, null, this);
    this.physics.add.overlap(this.player, this.goal, function(){ this.win(); }, null, this);

    /* 漂浮花瓣粒子 */
    if(this.petals) this.petals.destroy();
    this.petals = this.add.particles(0, WORLD_H, 'petal', {
      x:{min:0,max:3200},
      lifespan:9000,
      speedY:{min:-18,max:-40},
      speedX:{min:-12,max:12},
      scale:{start:1.2,end:0.2},
      alpha:{start:0.9,end:0},
      rotate:{min:0,max:360},
      frequency:280,
      tint:[0xffffff,0xffc9e0,0xc9fff0,0xffe9c9]
    });
    this.petals.setScrollFactor(0.3);

    /* 键盘 */
    this.cursors = this.input.keyboard.createCursorKeys();
    this.keyA = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A);
    this.keyD = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D);
    this.keyW = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.W);

    /* 相机跟随 */
    this.cameras.main.startFollow(this.player, true, 0.12, 0.12);

    /* 音乐（幂等：重启场景不重复添加） */
    this.music = null;
    if(this.sound.get('bgm')){
      this.music = this.sound.get('bgm');
    } else {
      try {
        this.music = this.sound.add('bgm', { loop:true, volume:0.5 });
        if(this.sound.locked){
          this.sound.once(Phaser.Sound.Events.UNLOCKED, function(){ if(window.__musicOn) this.music.play(); }, this);
        } else if(window.__musicOn){
          this.music.play();
        }
      } catch(e){ /* 无音频文件时静默 */ }
    }

    this.started = this.registry.get('started') === true;
    updateHud(L.name);

    if(this.started){
      document.getElementById('title').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
    }
  }

  update(){
    if(!this.started || !this.player) return;
    var body = this.player.body;
    var left = this.cursors.left.isDown || this.keyA.isDown || touch.left;
    var right = this.cursors.right.isDown || this.keyD.isDown || touch.right;
    var jump = Phaser.Input.Keyboard.JustDown(this.cursors.up) ||
               Phaser.Input.Keyboard.JustDown(this.cursors.space) ||
               Phaser.Input.Keyboard.JustDown(this.keyW) || touch.jump;
    touch.jump = false;

    if(left){ this.player.setVelocityX(-SPEED); this.player.setFlipX(true); }
    else if(right){ this.player.setVelocityX(SPEED); this.player.setFlipX(false); }
    else { this.player.setVelocityX(0); }

    if(jump && (body.blocked.down || body.touching.down)){
      this.player.setVelocityY(JUMP);
    }

    /* 掉落 */
    if(this.player.y > WORLD_H + 60) this.die();
  }

  die(){
    if(this.dead) return;
    this.dead = true;
    this.cameras.main.flash(240, 255, 120, 140);
    this.player.setVisible(false);
    this.time.delayedCall(240, function(){
      this.registry.set('level', this.registry.get('level') || 0);
      this.scene.restart();
    }, [], this);
  }

  win(){
    if(this.won) return;
    this.won = true;
    this.started = false;
    var lv = this.registry.get('level') || 0;
    if(lv >= LEVELS.length - 1){
      this.registry.set('started', false);
      this.registry.set('level', 0);
      showBanner('YOU WOKE UP', function(){
        hideHud();
        document.getElementById('final').classList.remove('hidden');
      });
      return;
    }
    showBanner('LEVEL CLEAR // 0' + (lv+1), function(){
      this.registry.set('level', lv + 1);
      this.scene.restart();
    }.bind(this));
  }
}

/* ---------- DOM / HUD ---------- */
var touch = { left:false, right:false, jump:false };

function updateHud(name){
  document.getElementById('hud-level').textContent = name;
  var btn = document.getElementById('hud-music');
  var on = window.__musicOn !== false;
  btn.textContent = on ? '♪ ON' : '♪ OFF';
}

function hideHud(){ document.getElementById('hud').classList.add('hidden'); }

function showBanner(text, done){
  var b = document.getElementById('banner');
  var m = document.getElementById('banner-msg');
  m.textContent = text;
  b.classList.add('show');
  setTimeout(function(){
    b.classList.remove('show');
    if(done) setTimeout(done, 320);
  }, 1100);
}

var game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'stage',
  width: 960,
  height: 540,
  transparent: true,
  pixelArt: true,
  physics: { default:'arcade', arcade:{ gravity:{ y:GRAVITY }, debug:false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [GameScene]
});

/* ---------- 音乐开关 ---------- */
window.__musicOn = true;
document.getElementById('hud-music').addEventListener('click', function(){
  window.__musicOn = !window.__musicOn;
  var sc = game.scene.getScene('game');
  if(sc && sc.music){
    if(window.__musicOn){ sc.music.resume(); }
    else { sc.music.pause(); }
  }
  updateHud(document.getElementById('hud-level').textContent);
});

/* ---------- 开始 ---------- */
function begin(){
  var sc = game.scene.getScene('game');
  if(sc) sc.registry.set('started', true);
  document.getElementById('title').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  var sc2 = game.scene.getScene('game');
  if(sc2) sc2.started = true;
}
document.getElementById('start-btn').addEventListener('click', begin);
document.getElementById('again-btn').addEventListener('click', function(){
  var sc = game.scene.getScene('game');
  sc.registry.set('started', true);
  sc.registry.set('level', 0);
  sc.scene.restart();
  document.getElementById('final').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('title').classList.add('hidden');
});
document.addEventListener('keydown', function(e){
  if(e.code === 'Space' || e.code === 'Enter'){
    if(!document.getElementById('title').classList.contains('hidden')){
      begin();
    } else if(!document.getElementById('final').classList.contains('hidden')){
      document.getElementById('again-btn').click();
    }
  }
});

/* ---------- 触摸按键 ---------- */
function bindTouch(sel, key){
  var el = document.querySelector(sel);
  if(!el) return;
  var on = function(e){ e.preventDefault(); if(key==='jump') touch.jump = true; else touch[key] = true; };
  var off = function(e){ e.preventDefault(); if(key==='jump') touch.jump = false; else touch[key] = false; };
  el.addEventListener('touchstart', on);
  el.addEventListener('touchend', off);
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindTouch('[data-key="left"]', 'left');
bindTouch('[data-key="right"]', 'right');
