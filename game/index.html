<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DREAMSIDE // 玻璃梦屋</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Song+Myung&family=Nunito:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0a16;overflow:hidden}
body{font-family:'Nunito','JetBrains Mono',sans-serif;color:#f4f1ff;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
#webgl-fail{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;background:#0a0a16;color:#f4f1ff;font-family:'Nunito',sans-serif}
#webgl-fail.show{display:flex}
#webgl-fail b{color:#f57eb6}

.vignette{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 58%,rgba(4,4,12,.6) 100%)}
.glitch-layer{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;mix-blend-mode:screen;
  background:repeating-linear-gradient(0deg,rgba(245,126,182,.05) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(125,211,252,.04) 0 1px,transparent 1px 4px)}
.glitch-layer.on{animation:glitchFlash .28s steps(2) 1}
@keyframes glitchFlash{0%{opacity:.55;transform:translateX(-6px)}25%{opacity:.1;transform:translateX(4px)}50%{opacity:.45;transform:translateX(-2px)}75%{opacity:.15;transform:translateX(2px)}100%{opacity:0;transform:none}}
#flash{position:fixed;inset:0;z-index:44;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:flashBang .5s ease 1}
@keyframes flashBang{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

.overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .9s ease,visibility .9s ease}
.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.kicker{font-size:12px;letter-spacing:.46em;color:rgba(245,126,182,.9);text-transform:uppercase;font-weight:700}
.title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(48px,10vw,118px);line-height:.9;letter-spacing:.02em;color:#fff;margin-top:10px;text-shadow:0 0 46px rgba(245,126,182,.55)}
.sub{font-family:'Song Myung',serif;margin-top:20px;font-size:16px;letter-spacing:.24em;color:rgba(244,241,255,.72)}
.start-hint{margin-top:42px;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;letter-spacing:.3em;color:#fff;background:rgba(245,126,182,.18);padding:14px 28px;border-radius:999px;animation:hintPulse 2s ease-in-out infinite;cursor:pointer;border:1px solid rgba(245,126,182,.55)}
@keyframes hintPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.04);opacity:1}}
.controls{margin-top:32px;font-family:'Nunito',sans-serif;font-size:12px;letter-spacing:.12em;color:rgba(244,241,255,.55);line-height:2}
.controls b{color:#f9a8d4}

.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;overflow:hidden}
.glitch::before{color:#7dd3fc;z-index:-1;animation:gl1 3s infinite linear alternate-reverse;transform:translate(-3px,0)}
.glitch::after{color:#f57eb6;z-index:-2;animation:gl2 3.8s infinite linear alternate-reverse;transform:translate(3px,0)}
@keyframes gl1{0%,86%,100%{clip-path:inset(0 0 90% 0)}12%{clip-path:inset(34% 0 42% 0)}30%{clip-path:inset(68% 0 8% 0)}48%{clip-path:inset(12% 0 64% 0)}64%{clip-path:inset(50% 0 28% 0)}}
@keyframes gl2{0%,90%,100%{clip-path:inset(86% 0 2% 0)}10%{clip-path:inset(18% 0 58% 0)}28%{clip-path:inset(58% 0 18% 0)}44%{clip-path:inset(38% 0 40% 0)}70%{clip-path:inset(8% 0 72% 0)}}

#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:10px;padding:16px 20px;pointer-events:none;transition:opacity .5s ease,transform .5s ease}
#hud.hidden{opacity:0;transform:translateY(-10px)}
.hud-item{font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;letter-spacing:.18em;color:#fff;background:rgba(24,16,36,.6);border:1px solid rgba(245,126,182,.35);border-radius:999px;padding:8px 16px;backdrop-filter:blur(8px)}
.hud-item.btn{pointer-events:auto;cursor:pointer;transition:background .25s ease}
.hud-item.btn:hover{background:rgba(245,126,182,.3)}
.hud-obj{margin-left:auto;color:#f9a8d4;border-color:rgba(245,126,182,.25)}

#prompt{position:fixed;left:50%;bottom:15%;transform:translateX(-50%);z-index:12;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;letter-spacing:.16em;color:#fff;background:rgba(24,16,36,.72);border:1px solid rgba(245,126,182,.55);border-radius:999px;padding:10px 22px;pointer-events:none;transition:opacity .25s ease;opacity:0}
#prompt.show{opacity:1}

#terminal{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,10,22,.72);backdrop-filter:blur(7px);transition:opacity .5s ease,visibility .5s ease}
#terminal.hidden{opacity:0;visibility:hidden;pointer-events:none}
.term-box{width:min(480px,100%);background:rgba(20,16,34,.95);border:1px solid rgba(245,126,182,.4);border-radius:16px;padding:30px 28px;text-align:left;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.term-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;letter-spacing:.26em;color:#f57eb6}
.term-body{margin-top:18px;font-family:'Song Myung',serif;font-size:15px;line-height:2.1;color:#e4e0f0;word-break:break-all}
.term-body .code{font-family:'JetBrains Mono',monospace;color:#7dd3fc;text-shadow:0 0 10px rgba(125,211,252,.5)}
.term-input{margin-top:22px;width:100%;padding:14px;background:rgba(10,10,22,.6);border:1px solid rgba(245,126,182,.4);border-radius:8px;color:#fff;font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.2em;text-align:center;outline:none}
.term-input:focus{border-color:#7dd3fc}
.term-actions{margin-top:16px;display:flex;gap:12px}
.term-btn{flex:1;padding:13px;border-radius:8px;border:1px solid rgba(245,126,182,.45);background:rgba(245,126,182,.14);color:#fff;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;letter-spacing:.16em;cursor:pointer;transition:background .2s ease}
.term-btn:hover{background:rgba(245,126,182,.3)}
.term-err{min-height:18px;margin-top:12px;font-family:'Nunito',sans-serif;font-size:11px;letter-spacing:.08em;color:#fda4af}

#banner{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .4s ease}
#banner.show{opacity:1;visibility:visible}
#banner .msg{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(30px,6vw,58px);color:#fff;letter-spacing:.06em;text-shadow:0 0 40px rgba(245,126,182,.6);transform:translateY(16px);transition:transform .5s cubic-bezier(.16,1,.3,1)}
#banner.show .msg{transform:none}

/* 终幕：全黑 + 问号 */
#end{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity 1s ease,visibility 1s ease}
#end.hidden{opacity:0;visibility:hidden;pointer-events:none}
.end-q{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(120px,30vw,300px);line-height:1;color:#f4f1ff;cursor:pointer;text-shadow:0 0 60px rgba(245,126,182,.6);animation:qPulse 2.4s ease-in-out infinite;transition:transform .2s ease}
.end-q:hover{transform:scale(1.06)}
@keyframes qPulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.end-hint{margin-top:26px;font-family:'Nunito',sans-serif;font-size:13px;letter-spacing:.3em;color:rgba(244,241,255,.55)}
.end-sub{margin-top:10px;font-family:'Song Myung',serif;font-size:14px;letter-spacing:.2em;color:rgba(245,126,182,.8)}
.end-foot{margin-top:48px;display:flex;gap:24px;font-family:'Nunito',sans-serif;font-size:11px;letter-spacing:.14em}
.end-foot a{color:rgba(244,241,255,.4);text-decoration:none;border-bottom:1px solid rgba(244,241,255,.2)}
.end-foot a:hover{color:#f57eb6}

#touch{position:fixed;inset:auto 0 0 0;z-index:12;display:none;gap:10px;justify-content:space-between;align-items:flex-end;padding:18px;pointer-events:none}
.tbtn{pointer-events:auto;min-width:54px;height:54px;border-radius:50%;border:1px solid rgba(245,126,182,.4);background:rgba(24,16,36,.6);color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);-webkit-tap-highlight-color:transparent;padding:0 14px}
.tbtn:active{background:rgba(245,126,182,.45)}
.tcluster{display:flex;gap:10px}
@media(pointer:coarse){#touch{display:flex}}
</style>
</head>

<div id="stage"></div>
<div class="vignette"></div>

<div id="webgl-fail"><div><div style="font-size:40px">✳</div><br>你的浏览器没有开启 <b>WebGL</b>，<br>这个梦境需要 3D 才能展开。<br><br><span style="font-size:12px;color:rgba(255,255,255,.5)">试试在浏览器设置里启用硬件加速。</span></div></div>

<div id="hud" class="hidden">
  <div class="hud-item" id="hud-level">ROOM 01 · 0/5</div>
  <div class="hud-item hud-obj" id="hud-obj">找到匹配符号的踏板</div>

</div>

<div id="prompt">E · 交互</div>

<div class="overlay" id="title">
  <div class="kicker">MAKE STUDIO · a dream house</div>
  <div class="title glitch" data-text="DREAMSIDE">DREAMSIDE</div>

    <b>W A S D / 方向键</b> 移动 &nbsp;·&nbsp; <b>鼠标拖拽</b> 视角 &nbsp;·&nbsp; <b>空格</b> 跳跃 &nbsp;·&nbsp; <b>E</b> 交互<br>
    五间屋子，五道谜题；解开一扇门，就通往下一间。

<div id="terminal" class="hidden">

  <div class="end-foot">
    <a href="index.html">回到官网</a>

</div>

<div id="touch">
  <div class="tcluster">
    <div class="tbtn" data-key="left">◀</div>

</div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
 * 配置
 * ============================================================ */
const BGM_URL = '../assets/bgm.mp3';      // 背景音乐（你的伴奏）
const EXE_URL = 'assets/DREAMSIDE-Setup.exe'; // 通关后点击「?」下载的 exe 路径

const GRAVITY = -22, JUMP = 8.6, MOVE = 6.0;
const HW = 0.35, PHEIGHT = 1.8;
const SPAWN = new THREE.Vector3(0, 0, -4);
const PINK = 0xf57eb6, CYAN = 0x7dd3fc, LAV = 0xa78bfa;

/* ---------------- 音效引擎（Web Audio 合成，离线可用） ---------------- */
let AC = null, noiseBuf = null;
function initAudio(){
  if(AC) return;
  try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
  if(AC && AC.state === 'suspended') AC.resume();
}
function getNoise(){
  if(!AC) return null;
  if(noiseBuf) return noiseBuf;
  noiseBuf = AC.createBuffer(1, AC.sampleRate*0.5, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return noiseBuf;
}
function tone(freq, dur, type, vol, slideTo){
  if(!AC) return;
  const t0 = AC.currentTime;
  const o = AC.createOscillator(); o.type = type||'sine';
  o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol||0.2, t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(AC.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}
function noise(dur, vol, filterType, f0, f1){
  if(!AC) return;
  const t0 = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = getNoise();
  const f = AC.createBiquadFilter(); f.type = filterType||'lowpass';
  f.frequency.setValueAtTime(f0||800, t0);
  if(f1) f.frequency.exponentialRampToValueAtTime(f1, t0+dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol||0.2, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  src.connect(f).connect(g).connect(AC.destination);
  src.start(t0); src.stop(t0+dur+0.03);
}
const SFX = {
  jump(){ tone(300, 0.18, 'square', 0.05, 640); },
  step(){ noise(0.06, 0.07, 'lowpass', 400); },
  gate(){ tone(520, 0.14, 'sine', 0.11); setTimeout(()=>tone(780,0.2,'sine',0.1), 90); },
  success(){ [660,880,1100].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'sine',0.12), i*80)); },
  fail(){ tone(150, 0.28, 'sawtooth', 0.09); },
  gasp(){ noise(0.6, 0.45, 'bandpass', 500, 2600); },
  portal(){ noise(0.5, 0.2, 'bandpass', 800, 3000); tone(880, 0.4, 'sine', 0.08, 1400); }
};
addEventListener('pointerdown', initAudio, { once:true });
addEventListener('keydown', initAudio, { once:true });

/* ---------------- 渲染器 / 场景 ---------------- */
const stage = document.getElementById('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias:true }); } catch(e){ renderer = null; }
if(!renderer){ document.getElementById('webgl-fail').classList.add('show'); throw new Error('WebGL unavailable'); }
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0c0a18, 0.014);
(function(){
  const c = document.createElement('canvas'); c.width = 2; c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,0,512);
  g.addColorStop(0,'#07070f'); g.addColorStop(0.55,'#12121f'); g.addColorStop(0.85,'#2a1a3a'); g.addColorStop(1,'#4a2a44');
  ctx.fillStyle = g; ctx.fillRect(0,0,2,512);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
})();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 240);
scene.add(new THREE.HemisphereLight(0x8a9ae0, 0x0a0a14, 0.42));
const moonLight = new THREE.DirectionalLight(0xbcd0ff, 0.7);
moonLight.position.set(10, 26, 8); scene.add(moonLight);
function glowLight(color, x, y, z, inten, dist){
  const p = new THREE.PointLight(color, inten, dist, 1.5);
  p.position.set(x,y,z); scene.add(p); return p;
}

/* ---------------- 星空 ---------------- */
(function(){
  const dome = new THREE.Mesh(new THREE.SphereGeometry(120, 32, 20), new THREE.MeshBasicMaterial({ side:THREE.BackSide, fog:false }));
  const c = document.createElement('canvas'); c.width = 2; c.height = 1024;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,0,1024);
  g.addColorStop(0,'#05050d'); g.addColorStop(0.45,'#0d0d1c'); g.addColorStop(0.75,'#221436'); g.addColorStop(1,'#3c2140');
  ctx.fillStyle = g; ctx.fillRect(0,0,2,1024);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  dome.material.map = tex; dome.material.needsUpdate = true; scene.add(dome);
  const N = 1600, pos = new Float32Array(N*3), col = new Float32Array(N*3);
  const palette = [0xffffff,0xffffff,0xffd9ec,0xbcd8ff,0xf57eb6].map(c=>new THREE.Color(c));
  for(let i=0;i<N;i++){
    const th = Math.random()*Math.PI*2, ph = Math.random()*Math.PI*0.48, r = 110;
    pos[i*3] = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.cos(ph) + 6;
    pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
    const cc = palette[(Math.random()*palette.length)|0];
    col[i*3]=cc.r; col[i*3+1]=cc.g; col[i*3+2]=cc.b;
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(pos,3));
  sg.setAttribute('color', new THREE.BufferAttribute(col,3));
  const stars = new THREE.Points(sg, new THREE.PointsMaterial({ size:0.35, vertexColors:true, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false, fog:false }));
  scene.add(stars); window.__stars = stars;
  const moonSprite = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshBasicMaterial({ color:0xffe7f3, transparent:true, opacity:0.9, fog:false }));
  moonSprite.position.set(34, 46, -30); moonSprite.lookAt(0,0,0); scene.add(moonSprite);
})();

/* ---------------- 世界：玻璃梦屋（5 间房） ---------------- */
const DEPTH = 50;
const solids = [], walls = [], gates = [], interactables = [];

function boxMesh(w,h,d,mat){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); }
function matWall(color, emissive){ return new THREE.MeshStandardMaterial({ color, roughness:0.85, emissive:emissive||0x000000, emissiveIntensity:0, transparent:true, opacity:0.95 }); }
function addWall(axis, coord, span0, span1){
  const TH = 0.3, H = 4;
  const len = Math.abs(span1 - span0);
  const cx = axis==='x' ? coord : (span0+span1)/2;
  const cz = axis==='z' ? coord : (span0+span1)/2;
  const w = axis==='x' ? TH : len;
  const d = axis==='z' ? TH : len;
  const m = boxMesh(w, H, d, matWall(0x1a1830, 0x2a2444));
  m.position.set(cx, H/2, cz); scene.add(m);
  solids.push({ min:new THREE.Vector3(cx-w/2, 0, cz-d/2), max:new THREE.Vector3(cx+w/2, H, cz+d/2) });
  walls.push({ mesh:m, axis, coord, span:[Math.min(span0,span1), Math.max(span0,span1)] });
}
const floor = boxMesh(10, 0.3, DEPTH, new THREE.MeshStandardMaterial({ color:0x121020, roughness:0.9 }));
floor.position.set(0, -0.15, -DEPTH/2); scene.add(floor);
solids.push({ min:new THREE.Vector3(-5,-0.3,-DEPTH), max:new THREE.Vector3(5,0,0) });
function floorStrip(x0, z0, x1, z1, color){
  const w = Math.abs(x1-x0)||0.06, d = Math.abs(z1-z0)||0.06;
  const m = boxMesh(w, 0.04, d, new THREE.MeshBasicMaterial({ color }));
  m.position.set((x0+x1)/2, 0.02, (z0+z1)/2); scene.add(m);
}
floorStrip(-5,0,5,0,CYAN);
for(let i=1;i<=5;i++){ floorStrip(-5,-i*10,5,-i*10, i%2? PINK : CYAN); }

function glyphTexture(glyph){
  const c = document.createElement('canvas'); c.width=64; c.height=64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0a0a18'; ctx.fillRect(0,0,64,64);
  ctx.fillStyle = '#7dd3fc'; ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth=5; ctx.lineJoin='round';
  ctx.shadowColor = '#7dd3fc'; ctx.shadowBlur = 12;
  if(glyph==='tri'){ ctx.beginPath(); ctx.moveTo(32,12); ctx.lineTo(52,50); ctx.lineTo(12,50); ctx.closePath(); ctx.fill(); }
  else if(glyph==='circ'){ ctx.beginPath(); ctx.arc(32,32,20,0,Math.PI*2); ctx.fill(); }
  else { ctx.fillRect(16,16,32,32); }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; return tex;
}

function collides(x, y, z){
  for(const s of solids){
    if(x+HW > s.min.x && x-HW < s.max.x &&
       z+HW > s.min.z && z-HW < s.max.z &&
       y+PHEIGHT > s.min.y && y < s.max.y) return s;
  }
  return null;
}
function stepPhysics(dt){
  grounded = false;
  pPos.x += playerVel.x * dt;
  if(collides(pPos.x, pPos.y, pPos.z)){ pPos.x -= playerVel.x * dt; playerVel.x = 0; }
  pPos.z += playerVel.z * dt;
  if(collides(pPos.x, pPos.y, pPos.z)){ pPos.z -= playerVel.z * dt; playerVel.z = 0; }
  playerVel.y += GRAVITY * dt;
  pPos.y += playerVel.y * dt;
  const hit = collides(pPos.x, pPos.y, pPos.z);
  if(hit){
    if(playerVel.y < 0){ pPos.y = hit.max.y; grounded = true; }
    else { pPos.y = hit.min.y - PHEIGHT; }
    playerVel.y = 0;
  }
  player.position.copy(pPos);
  if(pPos.y < -20) respawn();
}

const camTarget = new THREE.Vector3();
function updateWallFade(dt){
  for(const w of walls){
    const a = w.axis, coord = w.coord, span = w.span;
    let between = false;
    if(a === 'z'){
      if((camera.position.z - coord) * (pPos.z - coord) < 0 && camera.position.x > span[0] && camera.position.x < span[1] && pPos.x > span[0] && pPos.x < span[1]) between = true;
    } else {
      if((camera.position.x - coord) * (pPos.x - coord) < 0 && camera.position.z > span[0] && camera.position.z < span[1] && pPos.z > span[0] && pPos.z < span[1]) between = true;
    }
    const target = between ? 0.12 : 0.95;
    w.mesh.material.opacity += (target - w.mesh.material.opacity) * Math.min(1, dt*12);
  }
}
function camOffset(){
  return new THREE.Vector3(
    camDist * Math.cos(camPitch) * Math.sin(camYaw),
    camDist * Math.sin(camPitch),
    camDist * Math.cos(camPitch) * Math.cos(camYaw)
  );
}
function updateCamera(dt){
  if(phase === 'play'){
    camTarget.lerp(new THREE.Vector3(pPos.x, pPos.y, pPos.z).add(camOffset()), Math.min(1, dt*8));
    camera.lookAt(pPos.x, pPos.y + 1.2, pPos.z);
  } else if(phase === 'intro'){
    const t = Math.min(1, (performance.now() - introStart) / INTRO_DUR);
    camTarget.lerpVectors(introFrom, introTo, easeInOutCubic(t));
    camera.lookAt(pPos.x, pPos.y + 1.2, pPos.z);
  } else if(phase === 'title'){
    const a = performance.now() * 0.0001;
    camTarget.lerp(new THREE.Vector3(Math.sin(a)*24, 12, -DEPTH/2 + Math.cos(a)*24), Math.min(1, dt*2));
    camera.lookAt(0, 0.5, -DEPTH/2);
  }
  camera.position.lerp(camTarget, Math.min(1, dt*8));
  updateWallFade(dt);
}

let phase = 'title';
let introStart = 0, introFrom, introTo;
const INTRO_DUR = 5200;
function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function startIntro(){
  introStart = performance.now();
  introFrom = new THREE.Vector3(0, 30, 16);

  camera.position.copy(introFrom);
  camera.lookAt(pPos.x, pPos.y + 1, pPos.z);
  phase = 'intro';
}
function begin(){

  initAudio();
  startIntro();
  document.getElementById('title').classList.add('hidden');
}

  const t = performance.now();

  if(phase === 'intro' && t - introStart > INTRO_DUR){
    phase = 'play';
    document.getElementById('hud').classList.remove('hidden');
    startMusic();
  }

  if(phase === 'play'){
    fwd.set(pPos.x - camera.position.x, 0, pPos.z - camera.position.z).normalize();
    right.set(-fwd.z, 0, fwd.x);
    let ix = 0, iz = 0;
    if(keys['KeyW'] || keys['ArrowUp'] || touch.fwd) iz += 1;
    if(keys['KeyS'] || keys['ArrowDown']) iz -= 1;
    if(keys['KeyA'] || keys['ArrowLeft'] || touch.left) ix -= 1;
    if(keys['KeyD'] || keys['ArrowRight'] || touch.right) ix += 1;
    move.set(0,0,0).addScaledVector(fwd, iz).addScaledVector(right, ix);
    if(move.lengthSq() > 0) move.normalize();
    playerVel.x = move.x * MOVE;
    playerVel.z = move.z * MOVE;

    const jumpKey = keys['Space'] || touch.jump; touch.jump = false;
    if(jumpKey && grounded){ playerVel.y = JUMP; grounded = false; SFX.jump(); }

    stepPhysics(dt);
    checkSymbolTiles();
    checkPlate();
    checkPads();
    checkInteract();
    if(currentRoom() === 2 && !room2Hinted){ room2Hinted = true; playSequenceHint(); }
    updateObjective();

    const interactKey = keys['KeyE'] || touch.interact; touch.interact = false;
    if(interactKey && nearInteractable && currentInteractable) currentInteractable.onInteract();

    const speed = Math.hypot(playerVel.x, playerVel.z);
    const moving = speed > 0.4;
    if(moving){
      walkT += dt * 11;
      if(move.lengthSq() > 0) faceYaw = Math.atan2(move.x, move.z);
      if(grounded && t - lastStepT > 320){ lastStepT = t; SFX.step(); }
    }
    const swing = moving ? Math.sin(walkT) * 0.6 : 0;
    armL.rotation.x = swing; armR.rotation.x = -swing;
    legL.rotation.x = -swing; legR.rotation.x = swing;
    if(!grounded){ armL.rotation.x = -2.4; armR.rotation.x = 2.4; legL.rotation.x = 0.4; legR.rotation.x = -0.4; }
    player.rotation.y = faceYaw;
  }

  for(const g of gates){
    if(g.open && g.tween){
      const k = Math.min(1, (t - g.tween.start) / 900);
      g.mesh.position.y = g.tween.from + (g.tween.to - g.tween.from) * easeInOutCubic(k);
      g.mesh.material.opacity = Math.max(0, 0.82 * (1 - k));
      if(k >= 1) g.tween = null;
    }
  }

  if(window.__stars) window.__stars.rotation.y += dt * 0.004;
  if(window.__dust){ window.__dust.rotation.y += dt * 0.03; window.__dust.position.y = Math.sin(t*0.0005)*0.3; }
  portalRing.rotation.z += dt * 0.9;
  portalCore.material.opacity = 0.25 + Math.sin(t*0.003)*0.12;
  if(riddleTerminal.screen) riddleTerminal.screen.material.emissiveIntensity = 0.7 + Math.sin(t*0.004)*0.35;
  glass.material.opacity = 0.09 + Math.sin(t*0.0008)*0.02;

  if(phase === 'play'){
    const dx = pPos.x, dz = pPos.z + 48;
    if(dx*dx + dz*dz < 1.7 && !winTriggered){ winTriggered = true; win(); }
  }

  updateCamera(dt);
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

let winTriggered = false;
function win(){
  phase = 'win';
  document.getElementById('hud').classList.add('hidden');
  SFX.gasp();
  showBanner('YOU WOKE UP', () => {
    const fl = document.getElementById('flash');
    fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
    setTimeout(() => document.getElementById('end').classList.remove('hidden'), 380);
  });
}

/* ---------------- DOM / 横幅 / 终端 ---------------- */
function showBanner(text, done){
  const b = document.getElementById('banner'), m = document.getElementById('banner-msg');
  m.textContent = text; b.classList.add('show');
  setTimeout(() => { b.classList.remove('show'); if(done) setTimeout(done, 320); }, 1500);
}
function openTerminal(t){
  phase = 'prompt';
  currentTerminal = t;
  document.getElementById('term-title').textContent = t.title;
  document.getElementById('term-body').innerHTML = t.body;
  document.getElementById('term-input').value = '';
  document.getElementById('term-err').textContent = '';
  document.getElementById('terminal').classList.remove('hidden');
  setTimeout(() => document.getElementById('term-input').focus(), 80);
}
function closeTerminal(){
  document.getElementById('terminal').classList.add('hidden');
  phase = 'play';
}
document.getElementById('term-close').addEventListener('click', closeTerminal);
document.getElementById('term-submit').addEventListener('click', () => {
  const v = document.getElementById('term-input').value.trim().toLowerCase();
  if(currentTerminal && v === currentTerminal.answer){
    document.getElementById('terminal').classList.add('hidden');
    phase = 'play';
    openGate(gates[currentTerminal.gate]);
    showBanner('口令正确 · 门开启'); SFX.success(); updateObjective();
  } else {
    document.getElementById('term-err').textContent = '// 口令错误，再想想';
    SFX.fail();
  }
});
document.getElementById('term-input').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('term-submit').click();
  if(e.key === 'Escape') closeTerminal();
});

/* ---------------- 音乐 ---------------- */
const bgm = new Audio(BGM_URL); bgm.loop = true; bgm.volume = 0.5;
let musicOn = true;
function startMusic(){ if(musicOn) bgm.play().catch(()=>{}); }
document.getElementById('hud-music').addEventListener('click', () => {
  musicOn = !musicOn;
  document.getElementById('hud-music').textContent = musicOn ? '♪ ON' : '♪ OFF';
  if(musicOn) bgm.play().catch(()=>{}); else bgm.pause();
});

/* ---------------- 终幕：点击「?」→ 全屏 + 下载 exe ---------------- */
function downloadExe(){
  const a = document.createElement('a');
  a.href = EXE_URL; a.download = 'DREAMSIDE-Setup.exe';
  document.body.appendChild(a); a.click(); a.remove();
}
document.getElementById('end-q').addEventListener('click', () => {
  initAudio(); SFX.portal();
  try {
    const el = document.documentElement;
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch(e){}
  document.getElementById('end-hint').textContent = '正在下载…';
  document.getElementById('end-sub').style.display = 'block';
  setTimeout(downloadExe, 500);
});

/* ---------------- 开始 / 重来 ---------------- */
document.getElementById('start-btn').addEventListener('click', begin);
function restart(){
  winTriggered = false; phase = 'play';
  document.getElementById('end').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  pPos.copy(SPAWN); playerVel.set(0,0,0); player.position.copy(SPAWN);
  camYaw = 0; camPitch = 0.6; camDist = 7.5;
  gates.forEach(g => { g.open = false; g.tween = null; g.mesh.position.y = 1.5; g.mesh.material.opacity = 0.82; if(!solids.includes(g.solid)) solids.push(g.solid); });
  platePad.material.emissiveIntensity = 0.5;
  seqIndex = 0; room2Hinted = false; lastPadColor = null; lastSymbolTile = null;
  pads.forEach(p => { p.solved = false; p.mesh.material.emissiveIntensity = 0.6; });
  switches.forEach(s => { s.state = false; s.light.material.color.set(0x1a1a2a); });
  updateObjective();
}
document.getElementById('again-btn').addEventListener('click', restart);
addEventListener('keydown', e => {
  if(e.code === 'Space' || e.code === 'Enter'){
    if(!document.getElementById('title').classList.contains('hidden')) begin();
  }
});

/* ---------------- 自适应 ---------------- */
addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

updateObjective();
</script>
